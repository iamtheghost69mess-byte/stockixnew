components:
  parameters:
    OrgId:
      name: id
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
    WebhookEndpointId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: WebhookEndpoint document id
  securitySchemes:
    PlatformBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Platform access token (`aud` must be `platform`)
    PlatformApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
  schemas:
    SuccessWrapper:
      type: object
      properties:
        success: { type: boolean }
    SuccessTokenPair:
      allOf:
        - $ref: "#/components/schemas/SuccessWrapper"
        - type: object
          properties:
            data:
              type: object
              properties:
                accessToken: { type: string }
                refreshToken: { type: string }
    PlatformLoginResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessWrapper"
        - type: object
          properties:
            data:
              type: object
              properties:
                user: { type: object }
                accessToken: { type: string }
                refreshToken: { type: string }
    PlatformMeResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessWrapper"
        - type: object
          properties:
            data:
              type: object
              properties:
                user: { type: object }
    ComplianceJobQueued:
      type: object
      properties:
        success: { type: boolean }
        queued: { type: boolean }
        jobId: { type: string, nullable: true }
        queue: { type: string }
        reason: { type: string }
    ComplianceDeletionQueued:
      allOf:
        - $ref: "#/components/schemas/ComplianceJobQueued"
        - type: object
          properties:
            data: { type: object }
    OrganizationCreate:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
        planKey: { type: string }
        ownerEmail: { type: string, format: email }
        ownerName: { type: string }
        country: { type: string }
        city: { type: string }
        timezone:
          type: string
          description: IANA timezone identifier; defaults to Asia/Beirut when omitted
        licenseStartDate:
          type: string
          format: date-time
          nullable: true
          description: Canonical license window start
        licenseEndDate:
          type: string
          format: date-time
          nullable: true
          description: Canonical license window end
        licenseStartsAt:
          type: string
          format: date-time
          nullable: true
          description: Legacy alias for licenseStartDate
        licenseEndsAt:
          type: string
          format: date-time
          nullable: true
          description: Legacy alias for licenseEndDate
        entitlements:
          type: object
          description: Shallow-merged with tenant defaults (e.g. maxUsers, maxLocations, modules)
          additionalProperties: true
    OrganizationLicensePatch:
      type: object
      properties:
        licenseStartDate:
          type: string
          format: date-time
          nullable: true
        licenseEndDate:
          type: string
          format: date-time
          nullable: true
        licenseStartsAt:
          type: string
          format: date-time
          nullable: true
          description: Legacy alias for licenseStartDate
        licenseEndsAt:
          type: string
          format: date-time
          nullable: true
          description: Legacy alias for licenseEndDate
    SuccessOrgList:
      allOf:
        - $ref: "#/components/schemas/SuccessWrapper"
        - type: object
          properties:
            data:
              type: array
              items: { type: object }
            nextCursor:
              type: string
              nullable: true
              description: Pass as `cursor` query parameter for the next page (sorted by `_id` descending)
    PlatformNotificationListItem:
      type: object
      properties:
        id: { type: string }
        severity:
          type: string
          enum: [info, warning, critical]
        title: { type: string }
        body: { type: string, nullable: true }
        href: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        isRead: { type: boolean }
