      scheme: bearer
      bearerFormat: JWT
      description: |
        POS access token — claim **`aud`** must be **`pos`**. Same secret family as `JWT_SECRET` / access token config.
        **Do not** use platform tokens here.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: MongoDB ObjectId string
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1 }
      description: Page number when paginating (requires `limit`)
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100 }
      description: Page size when paginating (requires `page`)
    XLocationId:
      name: X-Location-Id
      in: header
      required: false
      schema: { type: string }
      description: |
        Branch filter for **admin/manager** without assigned `user.location`. Omit for all branches.
    ReportFrom:
      name: from
      in: query
      schema: { type: string, format: date }
      description: Report range start (ISO date)
    ReportTo:
      name: to
      in: query
      schema: { type: string, format: date }
      description: Report range end (ISO date)
    ReportGroupBy:
      name: groupBy
      in: query
      schema: { type: string, enum: [hour, day, week, month] }
    ReportTz:
      name: tz
      in: query
      schema: { type: string }
      description: Time zone (IANA), default UTC

  schemas:
    GoodsReceiptNote:
      type: object
      properties:
        _id: { type: string }
        purchaseOrderId: { type: string }
        supplierId: { type: string }
        locationId: { type: string }
        status: { type: string, enum: [draft, confirmed] }
        lines:
          type: array
          items:
            type: object
            properties:
              ingredientId: { type: string }
              receivedQty: { type: number }
              rejectedQty: { type: number }
              note: { type: string }
    RequestForQuotation:
      type: object
      properties:
        _id: { type: string }
        status: { type: string, enum: [draft, sent, received, converted] }
        supplierIds: { type: array, items: { type: string } }
        lines:
          type: array
          items:
            type: object
            properties:
              ingredientId: { type: string }
              quantity: { type: number }
    SerialNumber:
      type: object
      properties:
        serial: { type: string }
        status: { type: string, enum: [available, consumed, transferred, expired] }
        ingredientId: { type: string }
    Zone:
      type: object
      properties:
        name: { type: string }
        locationId: { type: string }
    Bin:
      type: object
      properties:
        name: { type: string }
        zoneId: { type: string }
    Budget:
      type: object
      properties:
        accountId: { type: string }
        fiscalYear: { type: number }
        periodMonth: { type: number }
        budgetedAmount: { type: number }
    RecurringInvoiceTemplate:
      type: object
      properties:
        customerId: { type: string }
        frequency: { type: string, enum: [daily, weekly, monthly] }
        isActive: { type: boolean }
        templateLines: { type: array, items: { type: object } }
