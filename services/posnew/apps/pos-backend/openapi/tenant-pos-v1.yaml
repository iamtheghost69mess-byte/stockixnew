openapi: 3.1.0
info:
  title: Restaurant POS — Tenant (Store) REST API
  version: 1.0.0
  description: |
    **Scope:** Authenticated restaurant operations — floors, kitchen, back office, inventory, and accounting — for a single
    **organization** (tenant). This is **not** the multi-tenant **platform** control plane (`/api/platform/v1`); see
    **Platform API** at `GET /api-docs/platform`.

    ---

    ### Authentication

    - **JWT access token** with claim `aud: pos` (see `utils/authTokens.js`). Send as `Authorization: Bearer <token>`
      or via HTTP-only cookie `accessToken` (same value).
    - **Refresh:** `POST /api/auth/refresh` with **`refreshToken` in JSON body** or **`refreshToken` HTTP-only cookie** (see `authController.refresh`).
    - **Rejected:** Platform JWTs (`aud: platform`) return **401** on POS routes.

    Tokens may include `organizationId`; middleware attaches `req.tenantOrganizationId` for org-scoped data.

    ---

    ### Correlation & tracing

    Send **`X-Request-Id`** (optional). CORS exposes `X-Request-Id` and `traceparent`. Aligns with platform guidance.

    ---

    ### Realtime (Socket.IO) — appendix

    Connect to the same HTTP origin as the REST API (Socket.IO on the main Node server). **Handshake:** send the POS JWT
    in `socket.handshake.auth.token` (string). **Rooms:** the server joins `org:{organizationId}` and optionally
    `org:{organizationId}:loc:{locationId}` when `auth.locationId` is set and allowed for the user. **Events (names):**
    `order:updated`, `order:new`, `table:status-changed`, `inventory:updated`, `inventory:low-stock`, `catalog:updated`.
    Payloads are small JSON objects; see `apps/pos-backend/docs/REALTIME_POS_EVENTS.md` in the repo.

    ---

    ### Location scope (`X-Location-Id`)

    Routes using **`authedTenantLocation`** resolve `req.locationScopeId`:

    | User | Behavior |
    |------|----------|
    | Staff with **`user.location` set** | Always scoped to that branch; header ignored. |
    | **`admin` / `manager`** without assigned location | Optional **`X-Location-Id`** (Mongo ObjectId). **Omit** = all locations (“super” scope). Invalid / foreign location → **403/404**. |
    | Other roles | Typically `null` scope; list endpoints may return unscoped or empty depending on handler. |

    **Affected examples:** `GET /api/tables`, `GET /api/orders`, `GET /api/printers`, `GET /api/reports/*`.

    ---

    ### RBAC model

    Authorization uses `@rbac/rbac` + per-org config (`rbacConfig` / `services/rbacService.js`). Built-in role keys include
    **`admin`**, **`manager`**, **`waiter`**, **`cashier`**, **`kitchen`**, **`hostess`**, plus **`accountant`** and **`accountant_readonly`**
    for GL. **Custom roles** may be defined in RBAC config (admin-managed).

    **Wildcard:** If a role’s effective `can` list contains `"*"`, it passes every permission check.

    **Default built-in capabilities (summary):**

    | Role | Floor POS | Back office | Kitchen | Accounting |
    |------|-----------|------------|---------|------------|
    | **admin** | Full (`*`) | Full | Full | Full |
    | **manager** | Broad (`pos.*`, `backoffice.*`) | Yes | Yes | Via `backoffice.*` |
    | **waiter** | Tables, catalog read, create/update **own** orders | No | No | No |
    | **cashier** | Waiter + **payments** | No | No | No |
    | **kitchen** | **Only** `pos.kitchen.read` / `pos.kitchen.write` | No | Yes | No |
    | **hostess** | Tables + catalog read (no orders / payments) | No | No | No |
    | **accountant** | No | No | No | `backoffice.accounting.read` + **write** |
    | **accountant_readonly** | No | No | No | **Read-only** GL |

    **Important order visibility:** `GET /api/orders` and single-order reads apply **`pos.order.read_all`** OR **waiter = current user**
    OR **`pos.payment.use`** (cashier) for access to a given order. Without `read_all`, list filter forces **`waiter = me`**.

    **Staff provisioning:** `GET|POST /api/users` requires **`backoffice.*`** and role **`admin` or `manager`**.

    **RBAC admin API:** `GET|PUT /api/rbac/config` and `GET /api/rbac/catalog` require **`admin`** + **`admin.rbac.manage`**.

    ---

    ### Listing pagination (common)

    Many list endpoints accept optional **`page`** and **`limit`** (both positive integers). When both present,
    `limit` is clamped to **1–100** and responses may include `{ success, data, page, limit, total }`.
    When omitted, handlers often return `{ success, data: [...] }` only.

    **Orders:** supports same pattern; `limit` max **100** when paging.

    ---

    ### Report date range

    Report endpoints use **`parseReportQuery`**: **`from`**, **`to`** (ISO dates). Defaults: `to` = now, `from` = 7 days before `to`.
    **`groupBy`:** `hour` | `day` | `week` | `month` (default `day`). **`tz`:** IANA string, default **`UTC`**.
    **`format=csv`:** some reports support CSV when implemented.

    ---

    ### Public / unauthenticated

    **`GET /api/public/menu`** and **`POST /api/public/self-order`** are **unauthenticated** (rate-limited). No tenant JWT.
    Tenant runtime access is blocked when organization license window is not currently valid.
    In blocked scenarios, support operations remain available only through platform endpoints (`/api/platform/v1/*`).

    ---

    ### Path aliases (Express)

    For legacy clients, **`/api/order`** mirrors **`/api/orders`** and **`/api/table`** mirrors **`/api/tables`** (same router).
    This document lists the **`/api/orders`** and **`/api/tables`** paths only.

    ---

    ### What OpenAPI does **not** guarantee

    - **Business rules** (inventory deduction timing, strict oversell, entitlement limits) live in services; behaviors may evolve.
    - **Response body shapes** are generally `{ success: true, data }` but not every field is enumerated here.
    - **WebSocket** events (`socket.io`, room `pos`) are **out of scope** for this spec.
    - **File uploads** use `multipart/form-data` (multer); max size / MIME rules are enforced in middleware.

    ---

    **Swagger UI:** `GET /api-docs/pos`
  contact:
    name: API support

servers:
  - url: /
    description: Backend root (e.g. http://localhost:8010)

tags:
  - name: Public
    description: Anonymous; rate-limited. No bearer token.
  - name: Auth
    description: Login, refresh, registration, invitation acceptance.
  - name: User session
    description: Current user profile; logout alternate mount under `/api/user`.
  - name: Staff users
    description: CRUD staff (`/api/users`). Requires backoffice + admin/manager.
  - name: RBAC
    description: Effective permissions for current user; catalog/config for admins.
  - name: Locations
  - name: Tables
  - name: Orders
    description: Floor and kitchen. Order list scope depends on role and location.
  - name: Payments
  - name: Catalog
    description: Categories + menu items.
  - name: Recipes
  - name: Upload
  - name: Printers
  - name: Customers
  - name: Reports
    description: Manager/admin back office; location-scoped queries.
  - name: Config
    description: Tax and public menu branding.
  - name: Loyalty
  - name: Inventory
    description: Stock, movements, analytics; read vs write separated.
  - name: Ingredients
  - name: Ingredient categories
  - name: Suppliers
  - name: Ingredient supplier links
  - name: Purchase orders
  - name: Stock takes
  - name: Accounting
    description: GL, journals, exports, FX, periods — accountant or `backoffice.*`.
  - name: Tenant tools
    description: Isolation test listing; metering hooks.
  - name: Warehouse
    description: Zones and bins for granular storage tracking.
  - name: Request for Quotations
    description: Multi-supplier bidding and procurement workflows.

paths:
  /api/public/menu:
    get:
      tags: [Public]
      summary: Public menu for QR / kiosk
      description: |
        Returns categories (with **`parentCategory`**, **`sortOrder`**, and optional **`menuNote`**) and all menu items for one organization.
        Item rows include **`isAvailable`** so clients can render out-of-stock state instead of filtering server-side.
        Provide **exactly one** of:
        - **`table`** — opaque table token from QR (legacy table Mongo id still accepted); resolves org from the table; branding tries the table’s location scope then `default`.
        - **`org`** — organization **`slug`** (venue browse link); org must be inside valid license window; branding uses optional **`location`** scope then `default`.

        **Visitor analytics (optional):** send stable **`X-Visitor-Key`** (e.g. UUID in `localStorage`) so the venue can count **one menu open per visitor-key per UTC day** for the default dashboard. Optional **`X-Session-Id`** is stored with the event. Requests without **`X-Visitor-Key`** are not counted.
      parameters:
        - name: X-Visitor-Key
          in: header
          required: false
          schema: { type: string }
        - name: X-Session-Id
          in: header
          required: false
          schema: { type: string }
        - name: table
          in: query
          required: false
          schema: { type: string }
          description: Opaque table token from QR (legacy table Mongo id accepted), mutually exclusive with `org`
        - name: org
          in: query
          required: false
          schema: { type: string }
          description: Organization slug, lowercase (mutually exclusive with `table`)
        - name: location
          in: query
          required: false
          schema: { type: string }
          description: Location Mongo id — only with **`org`**; optional branding scope before `default`
      responses:
        "200":
          description: branding + categories + items
        "400":
          description: Missing / invalid query (e.g. both or neither of `table` and `org`)
        "403":
          description: Organization blocked by license window
        "404":
          description: Table or organization not found
  /api/public/self-order:
    post:
      tags: [Public]
      summary: Submit self-service order (unauthenticated)
      description: |
        Creates order from public context; subject to same inventory / validation rules as POS where applicable.
      responses:
        "200": { description: OK }
        "400": { description: Validation / inventory error }

  /api/auth/register:
    post:
      tags: [Auth]
      security: [{ PosBearer: [] }]
      summary: Register user (existing admin session)
      description: 'Requires **authenticated** tenant user with role **admin** only.'
      responses:
        "201": { description: Created }
        "403": { description: Not admin }
  /api/auth/login:
    post:
      tags: [Auth]
      summary: POS login
      security: []
      description: |
        Rate-limited. Returns JWT pair; may set cookies.
        Fails with **403** when organization is outside its license window.
        Response body may include codes such as **`LICENSE_NOT_STARTED`**, **`LICENSE_EXPIRED`**, or **`LICENSE_WINDOW_MISSING`**.
      responses:
        "200": { description: Token pair + user }
        "401": { description: Invalid credentials }
        "403": { description: Organization blocked by license window or not found }
  /api/auth/invitations/accept:
    post:
      tags: [Auth]
      summary: Accept staff invitation
      security: []
      description: Rate-limited.
      responses:
        "200": { description: OK }
  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      description: Optional body `{ refreshToken }` or refresh cookie / header per implementation.
      responses:
        "200": { description: New tokens }
        "401": { description: Invalid refresh }
  /api/auth/logout:
    post:
      tags: [Auth]
      security: [{ PosBearer: [] }]
      summary: Logout (invalidate session cookies / tokens as implemented)
      responses:
        "200": { description: OK }

  /api/user/login:
    post:
      tags: [User session]
      summary: Alternate mount — same as `/api/auth/login`
      security: []
      responses:
        "200": { description: OK }
  /api/user/logout:
    post:
      tags: [User session]
      security: [{ PosBearer: [] }]
      summary: Common mount for SPA logout
      responses:
        "200": { description: OK }
  /api/user/:
    get:
      tags: [User session]
      security: [{ PosBearer: [] }]
      summary: Current user payload / bootstrap
      responses:
        "200": { description: User profile }
        "401": { description: Missing or invalid token }

  /api/users:
    get:
      tags: [Staff users]
      security: [{ PosBearer: [] }]
      summary: List staff
      description: 'Permission **`backoffice.*`**; roles **admin** or **manager** only. Supports optional `page`/`limit`.'
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: Staff list or paginated envelope }
        "403": { description: Forbidden }
    post:
      tags: [Staff users]
      security: [{ PosBearer: [] }]
      summary: Create staff member
      description: Same gate as list.
      responses:
        "201": { description: Created }
  /api/users/{id}:
    get:
      tags: [Staff users]
      security: [{ PosBearer: [] }]
      summary: Get staff by id
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: OK }
        "404": { description: Not found }
    patch:
      tags: [Staff users]
      security: [{ PosBearer: [] }]
      summary: Update staff
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: OK }
    delete:
      tags: [Staff users]
      security: [{ PosBearer: [] }]
      summary: Delete / deactivate staff
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: OK }

  /api/rbac/me:
    get:
      tags: [RBAC]
      security: [{ PosBearer: [] }]
      summary: Effective RBAC view for current user
      responses:
        "200": { description: Role + resolved permissions }
  /api/rbac/custom-roles:
    get:
      tags: [RBAC]
      security: [{ PosBearer: [] }]
      summary: List custom role definitions
      description: '**`admin` or `manager`** with **`backoffice.*`**.'
      responses:
        "200": { description: OK }
        "403": { description: Forbidden }
  /api/rbac/catalog:
    get:
      tags: [RBAC]
      security: [{ PosBearer: [] }]
      summary: Permission catalog (admin RBAC)
      description: 'Requires **`admin`** + **`admin.rbac.manage`**.'
      responses:
        "200": { description: Permission ids and labels }
        "403": { description: Forbidden }
  /api/rbac/config:
    get:
      tags: [RBAC]
      security: [{ PosBearer: [] }]
      summary: Get RBAC config document
      description: '**`admin`** + **`admin.rbac.manage`**.'
      responses:
        "200": { description: Config }
    put:
      tags: [RBAC]
      security: [{ PosBearer: [] }]
      summary: Replace / update RBAC config (built-in overrides, custom roles)
      description: '**`admin`** + **`admin.rbac.manage`**.'
      responses:
        "200": { description: Saved }

  /api/locations/:
    get:
      tags: [Locations]
      security: [{ PosBearer: [] }]
      summary: List locations
      description: 'Requires **`backoffice.*`**. Pagination optional (`page`/`limit`).'
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: Locations }
    post:
      tags: [Locations]
      security: [{ PosBearer: [] }]
      summary: Create location
      description: '**`admin` or `manager`** + **`backoffice.*`**.'
      responses:
        "201": { description: Created }

  /api/tables/:
    get:
      tags: [Tables]
      security: [{ PosBearer: [] }]
      summary: List tables
      description: |
        **`pos.table.read`**. Location scope applies (`X-Location-Id` for admin/manager). Pagination optional.
      parameters:
        - $ref: "#/components/parameters/XLocationId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: Tables }
    post:
      tags: [Tables]
      security: [{ PosBearer: [] }]
      summary: Create table
      description: '**`pos.table.write`** + location scope.'
      parameters:
        - $ref: "#/components/parameters/XLocationId"
      responses:
        "201": { description: Created }
  /api/tables/{id}/qr:
    get:
      tags: [Tables]
      security: [{ PosBearer: [] }]
      summary: QR payload / link for table
      description: '**`pos.table.read`** (uses `authedTenant` without location middleware — ensure id is valid).'
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: QR data }
  /api/tables/{id}:
    get:
      tags: [Tables]
      security: [{ PosBearer: [] }]
      summary: Get table
      description: '**`pos.table.read`**.'
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Table }
    put:
      tags: [Tables]
      security: [{ PosBearer: [] }]
      summary: Update table
      description: '**`pos.table.write`**.'
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Updated }
    delete:
      tags: [Tables]
      security: [{ PosBearer: [] }]
      summary: Delete table
      description: |
        **`pos.table.write`**. Fails with **400** if the table still has an open check (`currentOrder`).
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Deleted }

  /api/orders/kitchen:
    get:
      tags: [Orders]
      security: [{ PosBearer: [] }]
      summary: Kitchen display queue
      description: '**`pos.kitchen.read`** + location scope.'
      parameters:
        - $ref: "#/components/parameters/XLocationId"
      responses:
        "200": { description: Orders for kitchen }
  /api/orders/for-table/{tableId}:
    get:
      tags: [Orders]
      security: [{ PosBearer: [] }]
      summary: Open order for table (if any)
      description: '**`pos.order.read`**.'
      parameters:
        - name: tableId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Order or empty }
  /api/orders/:
    get:
      tags: [Orders]
      security: [{ PosBearer: [] }]
      summary: List orders
      description: |
        **`pos.order.read`** + location scope. **Filter:** Without `pos.order.read_all`, results limited to **your** orders (`waiter`).
        Optional **`page`**, **`limit`** (≤100) for pagination.
      parameters:
        - $ref: "#/components/parameters/XLocationId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: Order array or paginated }
    post:
      tags: [Orders]
      security: [{ PosBearer: [] }]
      summary: Create order
      description: '**`pos.order.create`**.'
      responses:
        "201": { description: Created }
  /api/orders/sync:
    post:
      tags: [Orders]
      security: [{ PosBearer: [] }]
      summary: Offline batch sync
      description: '**`pos.order.create`** + location scope (for device sync).'
      parameters:
        - $ref: "#/components/parameters/XLocationId"
      responses:
        "200": { description: Sync result }
  /api/orders/{id}:
    get:
      tags: [Orders]
      security: [{ PosBearer: [] }]
      summary: Get order by id
      description: |
        **`pos.order.read`** plus **per-order** rule: `read_all` **or** assigned waiter **or** **`pos.payment.use`**.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Order }
        "403": { description: Cannot access other waiter’s order }
        "404": { description: Not found }
    put:
      tags: [Orders]
      security: [{ PosBearer: [] }]
      summary: Replace / update order (full update)
      description: '**`pos.order.update`** + write access rule (same family as read).'
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Updated }
    delete:
      tags: [Orders]
      security: [{ PosBearer: [] }]
      summary: Cancel / delete open order
      description: '**`pos.order.cancel`** (manager/admin default; not waiter default).'
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Deleted }
        "403": { description: Missing permission }
  /api/orders/{id}/items/{itemId}/status:
    patch:
      tags: [Orders]
      security: [{ PosBearer: [] }]
      summary: Kitchen line status
      description: '**`pos.kitchen.write`**.'
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
  /api/orders/{id}/items:
    patch:
      tags: [Orders]
      security: [{ PosBearer: [] }]
      summary: Patch order lines (add/remove/replace)
      description: '**`pos.order.update`**; blocked when order **paid/cancelled**.'
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: OK }
        "400": { description: Closed order }
  /api/orders/{id}/status:
    patch:
      tags: [Orders]
      security: [{ PosBearer: [] }]
      summary: Patch order status
      description: |
        **`pos.order.update`**; may trigger stock / accounting side effects.
        When setting **`orderStatus` → `paid`**, optional **`paymentSplits`**: `[{ "methodKey": "cash", "amount": 10 }, …]`
        must sum to **`bills.totalWithTax`** (multi-tender). Not used with **`billingMode: on_account`**.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: OK }
  /api/orders/{id}/transfer:
    patch:
      tags: [Orders]
      security: [{ PosBearer: [] }]
      summary: Transfer to another table
      description: '**`pos.order.transfer`** (managers typically; not waiter default).'
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: OK }
        "403": { description: Missing permission }
  /api/orders/{id}/manual-discount:
    post:
      tags: [Orders]
      security: [{ PosBearer: [] }]
      summary: Apply manual discount
      description: '**`pos.order.update`**.'
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: OK }
  /api/orders/{id}/reprint/{printerId}:
    post:
      tags: [Orders]
      security: [{ PosBearer: [] }]
      summary: Reprint tickets to printer
      description: '**`pos.order.update`**.'
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: printerId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
  /api/orders/{id}/print:
    post:
      tags: [Orders]
      security: [{ PosBearer: [] }]
      summary: Print kitchen (station submit) or customer receipt
      description: |
        **`pos.order.update`**. JSON body: `type` = `kitchen` | `receipt`.
        Kitchen runs the same flow as `PATCH .../status` with `submitStationTickets: true` (pending station lines, stock rules, mark sent).
        Receipt requires `printerId` (Mongo id of a printer in scope); ESC/POS to network, ePOS HTTP, or print job for USB/Bluetooth.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [kitchen, receipt]
                printerId:
                  type: string
                  description: Required when type is receipt
      responses:
        "200": { description: OK }
        "400": { description: Bad request }
        "403": { description: Missing permission }
        "404": { description: Order or printer not found }
        "502": { description: Receipt hardware dispatch failed }

  /api/payment/create-order:
    post:
      tags: [Payments]
      security: [{ PosBearer: [] }]
      summary: Create payment provider order (e.g. Razorpay)
      description: '**`pos.payment.use`**.'
      responses:
        "200": { description: Order / client payload }
  /api/payment/verify-payment:
    post:
      tags: [Payments]
      security: [{ PosBearer: [] }]
      summary: Verify payment
      description: '**`pos.payment.use`**.'
      responses:
        "200": { description: OK }
  /api/payment/webhook-verification:
    post:
      tags: [Payments]
      summary: Provider webhook (unauthenticated)
      security: []
      description: |
        Called by payment provider; **no** POS bearer. Validate signatures in controller.
      responses:
        "200": { description: Ack }

  /api/categories/:
    get:
      tags: [Catalog]
      security: [{ PosBearer: [] }]
      summary: List categories
      description: '**`pos.catalog.read`**.'
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: Categories }
    post:
      tags: [Catalog]
      security: [{ PosBearer: [] }]
      summary: Create category
      description: '**`admin` or `manager`** + **`backoffice.*`**.'
      responses:
        "201": { description: Created }
  /api/categories/{id}:
    put:
      tags: [Catalog]
