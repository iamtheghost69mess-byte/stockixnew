<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenAPI Explorer</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.18.3/swagger-ui.css" />
    <style>
      body {
                    margin: 0;
                    padding: 0;
                    background-color: transparent;
                  }
                  .swagger-ui .topbar { display: none; }
                  .swagger-ui .info { margin: 20px 0; }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5.18.3/swagger-ui-bundle.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.18.3/swagger-ui-standalone-preset.js" crossorigin="anonymous"></script>
    <script>
      window.onload = () => {
                    window.ui = SwaggerUIBundle({
                      url: "/api/platform/v1/openapi.json",
                      dom_id: '#swagger-ui',
                      deepLinking: true,
                      presets: [
                        SwaggerUIBundle.presets.apis,
                        SwaggerUIStandalonePreset
                      ],
                      plugins: [
                        SwaggerUIBundle.plugins.DownloadUrl
                      ],
                      layout: "StandaloneLayout"
                    });
                  };
    </script>
  </body>
</html>
