# ═══════════════════════════════════════════════════════════════
# Production Docker Compose — zerowix.cloud
# Backend services only. Frontends served by PM2 (pre-built in CI).
# Nginx runs on host (manages Cloudflare Origin Certificate).
# ═══════════════════════════════════════════════════════════════

services:
  pos-backend:
    build:
      context: .
      dockerfile: apps/pos-backend/Dockerfile
    container_name: pos-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8010"
    env_file: ./apps/pos-backend/.env
    volumes:
      - backend-uploads:/app/apps/pos-backend/uploads
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  platform-worker:
    build:
      context: .
      dockerfile: apps/pos-backend/Dockerfile
    container_name: platform-worker
    restart: unless-stopped
    command: ["node", "workers/platformWorker.js"]
    env_file: ./apps/pos-backend/.env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: pos-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme_in_production}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_in_production}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend-uploads:
    driver: local
  redis-data:
    driver: local

networks:
  internal:
    driver: bridge
