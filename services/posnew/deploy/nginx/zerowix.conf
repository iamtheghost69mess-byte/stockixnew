# ═══════════════════════════════════════════════════════════════
# Nginx Reverse Proxy — zerowix.cloud
# Cloudflare Full (Strict) SSL with Origin Certificate
#
# Install:
#   sudo cp deploy/nginx/zerowix.conf /etc/nginx/sites-available/zerowix
#   sudo ln -sf /etc/nginx/sites-available/zerowix /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# ═══════════════════════════════════════════════════════════════

# ── Cloudflare real IP restoration ──
# Cloudflare IPv4 ranges (https://www.cloudflare.com/ips-v4)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

# ── Rate limiting ──
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# ═════════════════════════════════════════════
# api.zerowix.cloud → pos-backend :8010
# ═════════════════════════════════════════════
server {
    listen 443 ssl http2;
    server_name api.zerowix.cloud;

    # Cloudflare Origin Certificate
    ssl_certificate     /etc/ssl/cloudflare/zerowix.cloud.pem;
    ssl_certificate_key /etc/ssl/cloudflare/zerowix.cloud.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # API proxy
    location / {
        limit_req zone=api burst=60 nodelay;

        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Socket.IO — WebSocket upgrade
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Long-lived WebSocket connections
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Static uploads (served directly by Nginx, bypass Node)
    location /uploads/ {
        alias /var/lib/docker/volumes/posnew_backend-uploads/_data/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}

# ═════════════════════════════════════════════
# pos.zerowix.cloud → studio-admin :3000
# ═════════════════════════════════════════════
server {
    listen 443 ssl http2;
    server_name pos.zerowix.cloud *.pos.zerowix.cloud;

    ssl_certificate     /etc/ssl/cloudflare/zerowix.cloud.pem;
    ssl_certificate_key /etc/ssl/cloudflare/zerowix.cloud.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        # Next.js HMR / WebSocket (production uses polling, but keep for safety)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ═════════════════════════════════════════════
# dash.zerowix.cloud → saas-dash :3010
# ═════════════════════════════════════════════
server {
    listen 443 ssl http2;
    server_name dash.zerowix.cloud;

    ssl_certificate     /etc/ssl/cloudflare/zerowix.cloud.pem;
    ssl_certificate_key /etc/ssl/cloudflare/zerowix.cloud.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ═════════════════════════════════════════════
# HTTP → HTTPS redirect (all subdomains)
# ═════════════════════════════════════════════
server {
    listen 80;
    server_name api.zerowix.cloud pos.zerowix.cloud dash.zerowix.cloud;
    return 301 https://$host$request_uri;
}
