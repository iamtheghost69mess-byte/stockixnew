version: 2
updates:
  # npm workspaces root (covers pos-backend, pos-frontend2, saas-dash, packages/*).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Batch minor/patch for stable runtime libs to cut PR noise.
      runtime-minor:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "prisma"
          - "@prisma/*"
      types-minor:
        applies-to: version-updates
        patterns:
          - "@types/*"
        update-types:
          - minor
          - patch
      dev-tooling-minor:
        applies-to: version-updates
        patterns:
          - "eslint*"
          - "@biomejs/*"
          - "vitest"
          - "@vitest/*"
          - "@playwright/*"
          - "playwright"
          - "typescript"
        update-types:
          - minor
          - patch
    ignore:
      # Majors need manual migration; we will bump them intentionally.
      - dependency-name: "next"
        update-types:
          - version-update:semver-major
      - dependency-name: "react"
        update-types:
          - version-update:semver-major
      - dependency-name: "react-dom"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor:
        applies-to: version-updates
        update-types:
          - minor
          - patch
