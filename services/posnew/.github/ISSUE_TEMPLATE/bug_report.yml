name: Bug report
description: Something is not working as expected.
title: "[bug] "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. The more context you give, the faster we can fix it.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - pos-backend (tenant API)
        - pos-backend (platform API)
        - saas-dash
        - pos-frontend2 / studio-admin
        - packages/ui
        - packages/platform-api
        - infra / CI
        - other
    validations:
      required: true

  - type: input
    id: tenant
    attributes:
      label: Tenant / school
      description: Subdomain or school ID if reproducible on a specific tenant.
      placeholder: e.g. acme-academy
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant logs, request IDs, or attach screenshots.
      render: shell

  - type: input
    id: env
    attributes:
      label: Environment
      description: Local / staging / production, browser, OS, commit SHA if known.
      placeholder: production, Chrome 131, commit abc1234
    validations:
      required: true
