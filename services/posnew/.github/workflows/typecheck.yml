name: typecheck

on:
  push:
    branches: [main]
    paths:
      - "apps/saas-dash/**"
      - "apps/pos-frontend2/**"
      - "packages/ui/**"
      - "packages/platform-api/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/typecheck.yml"
  pull_request:
    paths:
      - "apps/saas-dash/**"
      - "apps/pos-frontend2/**"
      - "packages/ui/**"
      - "packages/platform-api/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/typecheck.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # saas-dash and packages/ui must stay green.
  strict:
    name: typecheck (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --legacy-peer-deps

      # Regenerate so saas-dash consumers see current spec types.
      - name: Regenerate platform API types
        run: npm run generate:platform-api

      - name: Typecheck saas-dash
        run: npx tsc --noEmit -p apps/saas-dash/tsconfig.json

      - name: Typecheck packages/ui
        run: npx tsc --noEmit -p packages/ui/tsconfig.json

  studio-admin:
    name: typecheck (studio-admin)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Regenerate platform API types
        run: npm run generate:platform-api

      - name: Typecheck pos-frontend2
        run: npx tsc --noEmit -p apps/pos-frontend2/tsconfig.json
