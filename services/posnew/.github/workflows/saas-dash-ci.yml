name: saas-dash CI

on:
  push:
    branches: [main]
    paths:
      - "apps/saas-dash/**"
      - "apps/pos-backend/**"
      - "packages/platform-api/**"
      - "packages/ui/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/saas-dash-ci.yml"
  pull_request:
    paths:
      - "apps/saas-dash/**"
      - "apps/pos-backend/**"
      - "packages/platform-api/**"
      - "packages/ui/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/saas-dash-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JWT_SECRET: ci_jwt_secret_must_be_32_chars_min___ # gitleaks:allow
  PLATFORM_JWT_SECRET: ci_platform_jwt_secret_32_char_min__ # gitleaks:allow
  MONGODB_URI: mongodb://127.0.0.1:27017/ci-saas-dash
  PLATFORM_CORS_ORIGINS: http://127.0.0.1:3010,http://localhost:3010

jobs:
  saas-dash:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Architecture guard (single-engine / control-plane boundaries)
        run: npm run ci:architecture-guard

      - name: Platform OpenAPI types match spec
        run: npm run generate:platform-api && git diff --exit-code packages/platform-api/src/platform-v1.d.ts

      - name: Backend OpenAPI contract + unit tests
        working-directory: apps/pos-backend
        run: |
          node --test tests/openapi-contract.test.js tests/tenant-openapi-contract.test.js
          node --test tests/unit

      - name: saas-dash unit tests (Vitest)
        run: npm run test:unit -w saas-dash

      - name: Notification reliability unit checks
        run: |
          node --test apps/pos-backend/tests/unit/platform-notifications-controller.test.js
          npm run test:unit -w saas-dash -- src/lib/notification-store.test.ts src/lib/notifications-cache.test.ts src/lib/platform-critical-alerts.test.ts

      - name: Detect E2E secrets
        id: e2e
        env:
          O: ${{ secrets.E2E_PLATFORM_OWNER_EMAIL }}
          P: ${{ secrets.E2E_PLATFORM_OWNER_PASSWORD }}
          R: ${{ secrets.E2E_PLATFORM_SUPPORT_READ_EMAIL }}
          S: ${{ secrets.E2E_PLATFORM_SUPPORT_READ_PASSWORD }}
        run: |
          if [ -n "$O" ] && [ -n "$P" ] && [ -n "$R" ] && [ -n "$S" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Seed platform users and start API
        if: steps.e2e.outputs.enabled == 'true'
        env:
          E2E_PLATFORM_OWNER_EMAIL: ${{ secrets.E2E_PLATFORM_OWNER_EMAIL }}
          E2E_PLATFORM_OWNER_PASSWORD: ${{ secrets.E2E_PLATFORM_OWNER_PASSWORD }}
          E2E_PLATFORM_SUPPORT_READ_EMAIL: ${{ secrets.E2E_PLATFORM_SUPPORT_READ_EMAIL }}
          E2E_PLATFORM_SUPPORT_READ_PASSWORD: ${{ secrets.E2E_PLATFORM_SUPPORT_READ_PASSWORD }}
        run: |
          set -e
          cd apps/pos-backend
          PLATFORM_OWNER_EMAIL="$E2E_PLATFORM_OWNER_EMAIL" PLATFORM_OWNER_PASSWORD="$E2E_PLATFORM_OWNER_PASSWORD" npm run seed:platform-owner
          PLATFORM_SUPPORT_READ_EMAIL="$E2E_PLATFORM_SUPPORT_READ_EMAIL" PLATFORM_SUPPORT_READ_PASSWORD="$E2E_PLATFORM_SUPPORT_READ_PASSWORD" npm run seed:platform-support-read
          PORT=8010 npm start > /tmp/pos-api.log 2>&1 &
          echo $! > /tmp/pos-api.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8010/health; then
              exit 0
            fi
            sleep 1
          done
          echo "--- pos-backend log ---"
          cat /tmp/pos-api.log || true
          exit 1

      - name: Build saas-dash
        run: npm run build -w saas-dash
        env:
          NEXT_PUBLIC_POS_API_ORIGIN: http://127.0.0.1:8010

      - name: Start saas-dash
        if: steps.e2e.outputs.enabled == 'true'
        run: npm run start -w saas-dash > /tmp/saas-dash.log 2>&1 & echo $! > /tmp/saas-dash.pid
        env:
          NEXT_PUBLIC_POS_API_ORIGIN: http://127.0.0.1:8010

      - name: Wait for dashboard
        if: steps.e2e.outputs.enabled == 'true'
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3010/login; then
              exit 0
            fi
            sleep 1
          done
          echo "--- saas-dash log ---"
          cat /tmp/saas-dash.log || true
          exit 1

      - name: Install Playwright browser
        if: steps.e2e.outputs.enabled == 'true'
        working-directory: apps/saas-dash
        run: npx playwright install chromium --with-deps

      - name: Playwright E2E
        if: steps.e2e.outputs.enabled == 'true'
        working-directory: apps/saas-dash
        env:
          PLAYWRIGHT_SKIP_WEB_SERVER: "1"
          SAAS_DASH_BASE_URL: http://127.0.0.1:3010
          E2E_PLATFORM_OWNER_EMAIL: ${{ secrets.E2E_PLATFORM_OWNER_EMAIL }}
          E2E_PLATFORM_OWNER_PASSWORD: ${{ secrets.E2E_PLATFORM_OWNER_PASSWORD }}
          E2E_PLATFORM_SUPPORT_READ_EMAIL: ${{ secrets.E2E_PLATFORM_SUPPORT_READ_EMAIL }}
          E2E_PLATFORM_SUPPORT_READ_PASSWORD: ${{ secrets.E2E_PLATFORM_SUPPORT_READ_PASSWORD }}
        run: npm run test:e2e

      - name: Stop background servers
        if: always() && steps.e2e.outputs.enabled == 'true'
        run: |
          kill $(cat /tmp/pos-api.pid) 2>/dev/null || true
          kill $(cat /tmp/saas-dash.pid) 2>/dev/null || true
