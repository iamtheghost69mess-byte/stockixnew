name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false    # Never cancel a running deploy

permissions:
  contents: read

env:
  NEXT_PUBLIC_POS_API_ORIGIN: https://api.zerowix.cloud
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ── Gate: only deploy if backend CI passes ──
  ci-gate:
    uses: ./.github/workflows/pos-backend-ci.yml
    secrets: inherit

  # ── Build frontends in CI + deploy everything to VPS ──
  build-and-deploy:
    needs: [ci-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          NEXT_PUBLIC_POS_API_ORIGIN: https://api.zerowix.cloud

      # ── Build frontends (offloaded from VPS) ──
      - name: Build studio-admin
        run: npm run build -w pos-frontend2

      - name: Build saas-dash
        run: npm run build -w saas-dash

      # ── Security: scan backend deps for vulnerabilities ──
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: apps/pos-backend
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

      # ── Deploy to VPS via SSH ──
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 15m
          script: |
            cd /home/deploy/posnew
            bash deploy/deploy.sh 2>&1 | tee -a /home/deploy/logs/deploy-$(date +%Y%m%d-%H%M%S).log

      # ── Post-deploy smoke test ──
      - name: Smoke test — API health
        run: |
          sleep 10
          curl -fsS --retry 5 --retry-delay 5 https://api.zerowix.cloud/health
          echo ""
          echo "✅ API healthy"

      - name: Smoke test — frontend reachable
        run: |
          curl -fsS --retry 3 --retry-delay 5 -o /dev/null -w "%{http_code}" https://pos.zerowix.cloud/ || echo "⚠ pos.zerowix.cloud not responding"
          curl -fsS --retry 3 --retry-delay 5 -o /dev/null -w "%{http_code}" https://dash.zerowix.cloud/ || echo "⚠ dash.zerowix.cloud not responding"
