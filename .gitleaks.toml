title = "Stockix gitleaks policy"
minVersion = "8.30.1"

[extend]
useDefault = true

[allowlist]
description = "Narrow allowlist for third-party fixtures and files without inline-comment support."
paths = [
  '''^services/posnew/apps/pos-backend/package\.json$''',
  '''^services/chatlive/\.github/workflows/run_mfa_spec\.yml$''',
  '''^services/chatlive/app/javascript/dashboard/helper/specs/fixtures/automationFixtures\.js$''',
  '''^services/chatlive/app/javascript/dashboard/store/modules/specs/agentBots/fixtures\.js$''',
  '''^services/chatlive/app/javascript/widget/store/modules/specs/message/actions\.spec\.js$''',
  '''^services/chatlive/config/initializers/devise\.rb$''',
  '''^services/chatlive/config/secrets\.yml$''',
  '''^services/chatlive/spec/controllers/api/v1/notification_subscriptions_controller_spec\.rb$''',
  '''^services/chatlive/spec/services/line/incoming_message_service_spec\.rb$''',
  '''^services/chatlive/spec/services/tiktok/token_service_spec\.rb$''',
  '''^services/chatlive/spec/support/slack_stubs\.rb$''',
  '''^services/chatlive/swagger/paths/application/portal/show\.yml$''',
  '''^services/chatlive/swagger/paths/application/portal/update\.yml$''',
  '''^services/chatlive/swagger/swagger\.json$''',
  '''^services/chatlive/swagger/tag_groups/application_swagger\.json$''',
]
