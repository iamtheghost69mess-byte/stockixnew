# Stockix control-plane PostgreSQL on your VPS (not Neon/Supabase).
# Binds to loopback only — not reachable from the internet; API connects via 127.0.0.1.
#
#   pnpm bootstrap:env   # or create infra/vps/.env with POSTGRES_* (see env/development/vps-postgres.env)
#   docker compose -f infra/vps/docker-compose.postgres.yml --env-file infra/vps/.env up -d
#
name: stockix-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/vps/.env}
      POSTGRES_DB: ${POSTGRES_DB:-stockix_platform}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - stockix_platform_pg:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-stockix_platform}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  stockix_platform_pg:
