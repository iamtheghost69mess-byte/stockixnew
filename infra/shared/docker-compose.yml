# Stockix shared infrastructure — started once, used by ALL tenant stacks.
# Run from repo root:
#   docker compose -f infra/shared/docker-compose.yml --env-file infra/prod/.env \
#     -p stockix-shared up -d
#
# All tenant app containers join the `stockix-shared` external network.
# Tenant containers reference databases by hostname:
#   MySQL   → stockix-mysql:3306   database: stockix_{slug}_finance  user: tenant_{slug}
#   MongoDB → stockix-mongo:27017  database: {slug}_pos
#   Redis   → stockix-redis:6379   key prefix: tenant:{slug}:
#
# Env vars that drive hostnames (set in infra/prod/.env):
#   SHARED_MYSQL_HOST=stockix-mysql
#   SHARED_MONGO_HOST=stockix-mongo
#   TENANT_REDIS_HOST=stockix-redis
#
# Provisioner responsibility:
#   On CREATE: CREATE DATABASE + CREATE USER + GRANT on MySQL; Mongo DB auto-created on first write.
#   On DELETE: DROP DATABASE + DROP USER on MySQL; dropDatabase() via mongosh exec.

name: stockix-shared

services:

  # ─────────────────────────────────────────────────────────────
  # MySQL 8 — one database per tenant (stockix_{slug}_finance)
  # Service name = DNS hostname inside stockix-shared network
  # ─────────────────────────────────────────────────────────────
  stockix-mysql:
    image: mysql:8.0-bookworm
    restart: unless-stopped
    hostname: stockix-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${SHARED_MYSQL_ROOT_PASSWORD}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=500
      - --innodb-buffer-pool-size=256M
      - --innodb-log-file-size=64M
      - --slow-query-log=ON
      - --long-query-time=2
    volumes:
      - shared_mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      stockix-shared:
        aliases:
          - shared-mysql
          - stockix-mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "--password=${SHARED_MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    cpus: "0.5"
    mem_swappiness: 0
    oom_kill_disable: false
    security_opt:
      - no-new-privileges:true

  # ─────────────────────────────────────────────────────────────
  # MongoDB 6 — one database per tenant ({slug}_pos)
  # Single node replica set (rs0) — required by POS connection string
  # (?replicaSet=rs0). On upgrade to multi-server, add members to rs.
  # ─────────────────────────────────────────────────────────────
  stockix-mongo:
    image: mongo:6.0
    restart: unless-stopped
    hostname: stockix-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - shared_mongo_data:/data/db
    networks:
      stockix-shared:
        aliases:
          - shared-mongo
          - stockix-mongo
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --eval "try { var s = rs.status(); if (s.ok !== 1) quit(1); } catch(e) { quit(1); }"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    cpus: "0.5"
    mem_swappiness: 0
    oom_kill_disable: false
    security_opt:
      - no-new-privileges:true

  # One-shot: initiates the replica set on first boot, idempotent on restarts.
  stockix-mongo-rs-init:
    image: mongo:6.0
    restart: "no"
    depends_on:
      stockix-mongo:
        condition: service_healthy
    networks:
      - stockix-shared
    entrypoint:
      - bash
      - -ec
      - |
        mongosh --host stockix-mongo:27017 --quiet --eval "
          try {
            rs.status();
            print('replica set already initiated');
          } catch (e) {
            rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'stockix-mongo:27017' }] });
            print('replica set initiated');
          }
        "
    mem_limit: 128m
    cpus: "0.1"
    mem_swappiness: 0

  # ─────────────────────────────────────────────────────────────
  # Tenant Redis — BullMQ + Finance Agenda jobs for ALL tenants.
  # Kept separate from control-plane-redis (stockix_internal network).
  # Key convention enforced by tenant-env.ts:
  #   tenant:{slug}:queue:*    BullMQ (POS bigcapital-sync)
  #   tenant:{slug}:agenda:*   Finance Agenda scheduler
  #   tenant:{slug}:session:*  Finance sessions
  # ─────────────────────────────────────────────────────────────
  stockix-redis:
    image: redis:7-alpine
    restart: unless-stopped
    hostname: stockix-redis
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "900 1"
      - --save
      - "300 10"
      - --appendonly
      - "no"
    volumes:
      - shared_tenant_redis_data:/data
    networks:
      stockix-shared:
        aliases:
          - tenant-redis
          - stockix-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    mem_limit: 192m
    cpus: "0.25"
    mem_swappiness: 0
    oom_kill_disable: false
    security_opt:
      - no-new-privileges:true

  # ─────────────────────────────────────────────────────────────
  # Shared Nginx — serves Finance webapp static assets for all tenants
  # Static root: /var/www/{slug}/public/ (populated by provision-runtime, future)
  # ─────────────────────────────────────────────────────────────
  stockix-nginx:
    image: nginx:alpine
    container_name: stockix-shared-nginx-1
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - stockix_webapp_static:/var/www:ro
    networks:
      stockix-shared:
        aliases:
          - shared-nginx
          - stockix-nginx
    mem_limit: 64m
    cpus: "0.1"
    mem_swappiness: 0
    security_opt:
      - no-new-privileges:true

volumes:
  shared_mysql_data:
    name: stockix_shared_mysql
  shared_mongo_data:
    name: stockix_shared_mongo
  shared_tenant_redis_data:
    name: stockix_shared_tenant_redis
  stockix_webapp_static:
    name: stockix_webapp_static

networks:
  stockix-shared:
    name: stockix-shared
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24