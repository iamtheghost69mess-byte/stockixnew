# REPAIRED: worker host DB access — MySQL 3306 + Mongo 27017 published for WORKER_SHARED_* 2026-06-05
# Local dev only — publish shared DB ports to the host for the infra worker (runs on host, not on stockix-shared).
# Used by pnpm dev via: docker compose -f docker-compose.yml -f docker-compose.dev-ports.yml
# Tenant containers still use stockix-mysql / stockix-mongo / stockix-redis on the stockix-shared network.

services:
  stockix-gotenberg:
    ports:
      # Host 9000 → container 3000 (matches upstream bigcapital convention).
      # Set GOTENBERG_URL=http://localhost:9000 when running Finance server outside Docker.
      - "127.0.0.1:9000:3000"
  stockix-mysql:
    ports:
      - "127.0.0.1:3306:3306"
  stockix-mysql-proxy:
    ports:
      # 6032 (ProxySQL admin) stays on stockix_internal only — avoids host port clashes.
      # Host 16033 when 6033 is stuck (Docker Desktop ghost bind on WSL2/Windows).
      # Set WORKER_MYSQL_PROXY_PORT=16033 in root .env so the host-run worker uses this port.
      - "127.0.0.1:16033:6033"
  stockix-mongo:
    ports:
      - "127.0.0.1:27017:27017"
  stockix-redis:
    ports:
      - "127.0.0.1:6380:6379"
