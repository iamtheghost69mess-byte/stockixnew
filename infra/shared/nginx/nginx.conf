user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  # Per-tenant static file serving
  # Static files served from /var/www/{slug}/public/
  server {
    listen 80;
    server_name ~^(?<slug>.+)\.stockix\.cloud$;

    location / {
      root /var/www/$slug/public;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /api/ is intentionally 404 — Finance API is served directly by the
    # tenant Finance server container via Traefik, not proxied through nginx.
    # Nginx role: static file CDN only (Finance webapp build artifacts).
    # Architecture2.md §5.4 — shared nginx is static-only by design.
    location /api/ {
      return 404;
    }
  }
}
