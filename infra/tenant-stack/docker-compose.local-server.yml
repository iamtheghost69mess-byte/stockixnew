# Optional override: build API server from your fork (mail templates, TypeScript, etc.).
#
#   docker compose -f docker-compose.yml -f docker-compose.local-server.yml build server
#   docker compose -f docker-compose.yml -f docker-compose.local-server.yml up -d

services:
  server:
    build:
      context: ${STOCKIX_TENANT_APP_ROOT}
      dockerfile: packages/server/Dockerfile
    image: stockix-server:local
