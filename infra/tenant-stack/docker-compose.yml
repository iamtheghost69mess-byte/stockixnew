# Stockix per-tenant BigCapital stack (prod-shaped). Compose v2: `docker compose -p <project> ...`
# Paths use BIGCAPITAL_ROOT (vendored BigCapital repo). Service name MUST be `mysql` (DB_HOST=mysql).
# Traefik terminates TLS; nginx here is HTTP only (WEB_SSL=false).

services:
  nginx:
    build:
      context: ${BIGCAPITAL_ROOT}/docker/nginx
      args:
        - SERVER_PROXY_PORT=3000
        - WEB_SSL=false
        - SELF_SIGNED=false
    volumes:
      - ${BIGCAPITAL_ROOT}/data/logs/nginx:/var/log/nginx
      - ${BIGCAPITAL_ROOT}/docker/certbot/certs:/var/certs
    ports:
      - "${PUBLIC_PROXY_PORT}:80"
    tty: true
    depends_on:
      - server
      - webapp

  webapp:
    image: ghcr.io/bigcapitalhq/webapp:latest

  server:
    image: ghcr.io/bigcapitalhq/server:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
    environment:
      # Official image loads newrelic; without these it logs bootstrap errors locally.
      - NEW_RELIC_ENABLED=false
      - NEW_RELIC_APP_NAME=bigcapital-local
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_PORT=${MAIL_PORT:-}
      - MAIL_SECURE=${MAIL_SECURE:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-}
      - DB_HOST=mysql
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_CHARSET=${DB_CHARSET}
      - SYSTEM_DB_NAME=${SYSTEM_DB_NAME}
      - TENANT_DB_NAME_PERFIX=${TENANT_DB_NAME_PERFIX}
      - JWT_SECRET=${JWT_SECRET}
      - MONGODB_DATABASE_URL=mongodb://mongo/bigcapital
      - BASE_URL=${BASE_URL}
      - AGENDASH_AUTH_USER=${AGENDASH_AUTH_USER}
      - AGENDASH_AUTH_PASSWORD=${AGENDASH_AUTH_PASSWORD}
      - SIGNUP_DISABLED=${SIGNUP_DISABLED}
      - SIGNUP_ALLOWED_DOMAINS=${SIGNUP_ALLOWED_DOMAINS:-}
      - SIGNUP_ALLOWED_EMAILS=${SIGNUP_ALLOWED_EMAILS}

  database_migration:
    build:
      context: ${BIGCAPITAL_ROOT}
      dockerfile: docker/migration/Dockerfile
    environment:
      - DB_HOST=mysql
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_CHARSET=${DB_CHARSET}
      - SYSTEM_DB_NAME=${SYSTEM_DB_NAME}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    build:
      context: ${BIGCAPITAL_ROOT}/docker/mariadb
    environment:
      - MYSQL_DATABASE=${SYSTEM_DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    volumes:
      - mysql:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s

  mongo:
    build:
      context: ${BIGCAPITAL_ROOT}/docker/mongo
    expose:
      - "27017"
    volumes:
      - mongo:/var/lib/mongodb

  redis:
    build:
      context: ${BIGCAPITAL_ROOT}/docker/redis
    expose:
      - "6379"
    volumes:
      - redis:/data

volumes:
  mysql:
  mongo:
  redis:
