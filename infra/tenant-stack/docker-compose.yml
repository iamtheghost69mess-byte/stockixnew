# Stockix per-tenant stack (prod-shaped). Compose v2: `docker compose -p <project> ...`
# STOCKIX_TENANT_APP_ROOT must point at the finance monorepo root (this repo: services/stockix-finance).
# Service name MUST be `mysql` (DB_HOST=mysql).
# Traefik terminates TLS; nginx here is HTTP only (WEB_SSL=false).

services:
  nginx:
    image: stockix-nginx:local
    build:
      context: ${STOCKIX_TENANT_APP_ROOT}/docker/nginx
      args:
        - SERVER_PROXY_PORT=3000
        - WEB_SSL=false
        - SELF_SIGNED=false
    restart: unless-stopped
    volumes:
      # Named volume: bind-mounting host logs under STOCKIX_TENANT_APP_ROOT often breaks on
      # Docker Desktop (Windows/macOS) and nginx exits before publishing PUBLIC_PROXY_PORT.
      - nginx_logs:/var/log/nginx
      - ${STOCKIX_TENANT_APP_ROOT}/docker/certbot/certs:/var/certs
    ports:
      - "${PUBLIC_PROXY_PORT}:80"
    tty: true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      server:
        condition: service_healthy
      webapp:
        condition: service_healthy
    mem_limit: 64m
    cpus: "0.1"
    mem_swappiness: 0
    oom_kill_disable: false

  webapp:
    image: stockix-webapp:local
    # If src changes appear ignored: BuildKit may reuse COPY/RUN layers. Use:
    #   node scripts/rebuild-tenant-webapp.mjs --tenant <slug>
    # or: docker compose ... build --no-cache webapp && up -d --force-recreate webapp
    build:
      context: ${STOCKIX_TENANT_APP_ROOT}
      dockerfile: packages/webapp/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: "0.25"
    mem_swappiness: 0
    oom_kill_disable: false

  server:
    image: stockix-server:local
    build:
      context: ${STOCKIX_TENANT_APP_ROOT}
      dockerfile: packages/server/Dockerfile
      target: app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/ping || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    cpus: "0.5"
    mem_swappiness: 0
    oom_kill_disable: false
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Official image loads newrelic; without these it logs bootstrap errors locally.
      - NEW_RELIC_ENABLED=false
      - NEW_RELIC_APP_NAME=stockix-local
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_PORT=${MAIL_PORT:-}
      - MAIL_SECURE=${MAIL_SECURE:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - QUEUE_HOST=${QUEUE_HOST:-redis}
      - QUEUE_PORT=${QUEUE_PORT:-6379}
      - S3_REGION=${S3_REGION:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-false}
      - DB_HOST=mysql
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_CHARSET=${DB_CHARSET}
      - SYSTEM_DB_NAME=${SYSTEM_DB_NAME}
      - TENANT_DB_NAME_PREFIX=${TENANT_DB_NAME_PREFIX:-${TENANT_DB_NAME_PERFIX}}
      - JWT_SECRET=${JWT_SECRET}
      - MONGODB_DATABASE_URL=mongodb://mongo/stockix
      - BASE_URL=${BASE_URL}
      - AGENDASH_AUTH_USER=${AGENDASH_AUTH_USER}
      - AGENDASH_AUTH_PASSWORD=${AGENDASH_AUTH_PASSWORD}
      - SIGNUP_DISABLED=${SIGNUP_DISABLED}
      - SIGNUP_ALLOWED_DOMAINS=${SIGNUP_ALLOWED_DOMAINS:-}
      - SIGNUP_ALLOWED_EMAILS=${SIGNUP_ALLOWED_EMAILS}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - DEPLOYMENT_SECRET_KEY=${DEPLOYMENT_SECRET_KEY}
      - THROTTLE_GLOBAL_TTL=${THROTTLE_GLOBAL_TTL:-60000}
      - THROTTLE_GLOBAL_LIMIT=${THROTTLE_GLOBAL_LIMIT:-2000}
      - THROTTLE_AUTH_TTL=${THROTTLE_AUTH_TTL:-60000}
      - THROTTLE_AUTH_LIMIT=${THROTTLE_AUTH_LIMIT:-200}
    ports:
      # Bind on all interfaces so the infra-worker container can reach this via host.docker.internal.
      - "0.0.0.0::3000"

  database_migration:
    image: stockix-database-migration:local
    # Override the image entrypoint (docker-entrypoint.sh wraps unknown commands with `node`).
    # The Alpine-based image has no /bin/bash, so the entrypoint would prepend `node` to the
    # bash command and fail with "Cannot find module '/bin/bash'". Running sh directly bypasses
    # this and lets the migration script exec node ./dist/cli.js correctly.
    entrypoint: ["/bin/sh"]
    build:
      context: ${STOCKIX_TENANT_APP_ROOT}
      dockerfile: packages/server/Dockerfile
      target: migration
    environment:
      - DB_CLIENT=mysql
      - DB_HOST=mysql
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_CHARSET=${DB_CHARSET}
      - DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - SYSTEM_DB_CLIENT=${SYSTEM_DB_CLIENT:-mysql}
      - SYSTEM_DB_HOST=${SYSTEM_DB_HOST:-mysql}
      - SYSTEM_DB_USER=${SYSTEM_DB_USER:-${DB_USER}}
      - SYSTEM_DB_PASSWORD=${SYSTEM_DB_PASSWORD:-${DB_PASSWORD}}
      - SYSTEM_DB_NAME=${SYSTEM_DB_NAME}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 1
      start_period: 10s
    command:
      - -c
      - |
        export DB_CLIENT="$${DB_CLIENT:-mysql}"
        export DB_HOST="$${DB_HOST:-mysql}"
        export DB_USER="$${SYSTEM_DB_USER:-$${DB_USER}}"
        export DB_PASSWORD="$${SYSTEM_DB_PASSWORD:-$${DB_PASSWORD}}"
        export SYSTEM_DB_CLIENT="$${SYSTEM_DB_CLIENT:-mysql}"
        export SYSTEM_DB_HOST="$${SYSTEM_DB_HOST:-mysql}"
        export SYSTEM_DB_USER="$${SYSTEM_DB_USER:-$${DB_USER}}"
        export SYSTEM_DB_PASSWORD="$${SYSTEM_DB_PASSWORD:-$${DB_PASSWORD}}"
        export DB_ROOT_PASSWORD="$${DB_ROOT_PASSWORD:-}"
        echo "MIGRATION_ENV DB_USER=$${DB_USER} DB_PASSWORD_LEN=$${#DB_PASSWORD} SYSTEM_DB_USER=$${SYSTEM_DB_USER} SYSTEM_DB_PASSWORD_LEN=$${#SYSTEM_DB_PASSWORD}"
        exec node ./build/commands.js system:migrate:latest
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: "0.25"
    mem_swappiness: 0
    oom_kill_disable: false

  mysql:
    image: stockix-prebuild-mysql:latest
    build:
      context: ${STOCKIX_TENANT_APP_ROOT}/docker/mariadb
    restart: unless-stopped
    mem_limit: 1g
    cpus: "0.75"
    mem_swappiness: 0
    oom_kill_disable: false
    environment:
      - MYSQL_DATABASE=${SYSTEM_DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    volumes:
      - mysql:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s
    security_opt:
      - no-new-privileges:true

  mongo:
    # Official image (same as former docker/mongo/Dockerfile). Avoids a custom build context
    # so provisioning still works if docker/mongo is missing from a shallow clone.
    image: mongo:5.0
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    mem_swappiness: 0
    oom_kill_disable: false
    expose:
      - "27017"
    volumes:
      - mongo:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand({ ping: 1 })' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  redis:
    image: stockix-prebuild-redis:latest
    build:
      context: ${STOCKIX_TENANT_APP_ROOT}/docker/redis
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    mem_swappiness: 0
    oom_kill_disable: false
    expose:
      - "6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

volumes:
  mysql:
    # Explicit name per tenant (MYSQL_VOLUME_NAME in per-tenant .env). Fallback matches
    # Compose legacy default when MYSQL_VOLUME_NAME is unset (already-provisioned stacks).
    name: ${MYSQL_VOLUME_NAME:-${COMPOSE_PROJECT_NAME}_mysql}
    driver: local
  mongo:
  redis:
  nginx_logs:
