# Override: build webapp from your fork under BIGCAPITAL_ROOT instead of ghcr.io/bigcapitalhq/webapp.
# (The base docker-compose.yml still uses upstream images — your local TS/React changes are NOT in those.)
#
# Usage (from this directory; tenant .env must set BIGCAPITAL_ROOT to .../stockix/services/bigcapital):
#   docker compose -f docker-compose.yml -f docker-compose.local-webapp.yml build webapp --no-cache
#   docker compose -f docker-compose.yml -f docker-compose.local-webapp.yml up -d
#
# Server changes (mail HTML, etc.): build from BIGCAPITAL_ROOT with packages/server/Dockerfile
# and set image: stockix-server:local on the server service, or use docker-compose.local-server.yml

services:
  webapp:
    build:
      context: ${BIGCAPITAL_ROOT}
      dockerfile: packages/webapp/Dockerfile
    image: stockix-webapp:local
