global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: stockix-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:4000"]

  - job_name: stockix-infra-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["infra-worker:9090"]
