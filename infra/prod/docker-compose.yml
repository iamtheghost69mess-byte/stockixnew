# Production stack: Traefik (TLS + routing), Postgres, Stockix API + Dashboard.
# Run from repo root on the server (e.g. /opt/stockix/stockixnew):
#   cd infra/prod && docker compose --env-file .env up -d --build
# Chat (Chatwoot): optional — see docker-compose.chat.yml (not used in deploy)
#
# Prerequisites:
#   1. Copy infra/prod/.env.example → infra/prod/.env and fill secrets (never commit .env).
#   2. On the server, sync env for worker dotenv fallback:
#        pnpm env:sync-prod   (copies infra/prod/.env → repo root .env)
#   3. Clone repo at STOCKIX_REPO (default /opt/stockix/stockixnew).
#
# Env injection: platform variables are passed explicitly into api + infra-worker
# (Compose wins over mounted .env; see STOCKIX_LOAD_ROOT_ENV).

name: stockix

# Shared runtime env for control plane (api + worker). Sourced from infra/prod/.env via compose substitution.
x-stockix-platform-env: &stockix-platform-env
  NODE_ENV: production
  ROOT_DOMAIN: ${ROOT_DOMAIN}
  PUBLIC_BASE_URL_SCHEME: ${PUBLIC_BASE_URL_SCHEME:-https}
  DASHBOARD_URL: ${DASHBOARD_URL}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  RELEASE_VERSION: ${RELEASE_VERSION:-}
  DB_POOL_MAX: ${DB_POOL_MAX:-20}
  DB_IDLE_TIMEOUT_SECONDS: ${DB_IDLE_TIMEOUT_SECONDS:-30}
  STOCKIX_API_URL: ${STOCKIX_API_URL:-}
  PLATFORM_API_SECRET: ${PLATFORM_API_SECRET}
  WORKER_SECRET: ${WORKER_SECRET}
  INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
  SESSION_SECRET: ${SESSION_SECRET}
  AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
  DEPLOYMENT_SECRET_KEY: ${DEPLOYMENT_SECRET_KEY}
  LICENSE_SIGNING_SECRET: ${LICENSE_SIGNING_SECRET}
  CONTROL_PLANE_REDIS_URL: ${CONTROL_PLANE_REDIS_URL:-}
  JWT_SECRET: ${JWT_SECRET:-}
  SIGNUP_DISABLED: ${SIGNUP_DISABLED:-true}
  SIGNUP_ALLOWED_DOMAINS: ${SIGNUP_ALLOWED_DOMAINS:-}
  SIGNUP_ALLOWED_EMAILS: ${SIGNUP_ALLOWED_EMAILS:-}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_SECURE: ${MAIL_SECURE:-false}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Stockix}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
  RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
  MONGODB_DATABASE_URL: ${MONGODB_DATABASE_URL:-mongodb://mongo/stockix}
  MAX_TENANT_PORT: ${MAX_TENANT_PORT:-4999}
  WORKER_JOB_EXECUTION_TIMEOUT_MS: ${WORKER_JOB_EXECUTION_TIMEOUT_MS:-2700000}
  PROVISION_POLL_MS: ${PROVISION_POLL_MS:-2000}
  PROVISION_MAX_MS: ${PROVISION_MAX_MS:-2700000}
  METRICS_ENDPOINT: ${METRICS_ENDPOINT:-}
  METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:-}
  # Do not load repo-root .env inside containers (use explicit env below).
  STOCKIX_LOAD_ROOT_ENV: "0"

x-stockix-worker-env: &stockix-worker-env
  <<: *stockix-platform-env
  REPO_ROOT: /opt/stockix/stockixnew
  STOCKIX_TENANT_APP_ROOT: ${STOCKIX_TENANT_APP_ROOT:-/opt/stockix/stockixnew/services/stockix-finance}
  TENANT_ENV_ROOT: ${TENANT_ENV_ROOT:-/opt/stockix/tenants}
  TRAEFIK_DYNAMIC_DIR: ${TRAEFIK_DYNAMIC_DIR:-/opt/stockix/traefik-dynamic}
  TRAEFIK_TENANT_UPSTREAM_HOST: ${TRAEFIK_TENANT_UPSTREAM_HOST:-host.docker.internal}
  TENANT_INTERNAL_HOST: ${TENANT_INTERNAL_HOST:-host.docker.internal}
  S3_REGION: ${S3_REGION:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  AGENDASH_AUTH_USER: ${AGENDASH_AUTH_USER:-agendash}
  AGENDASH_AUTH_PASSWORD: ${AGENDASH_AUTH_PASSWORD:-}
  DOCKER_HOST: tcp://socket-proxy:2375

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.1.1
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      VOLUMES: 0
      IMAGES: 1
      INFO: 0
      NODES: 0
      SERVICES: 0
      SWARM: 0
      TASKS: 0
      AUTH: 0
      SECRETS: 0
      CONFIGS: 0
      PLUGINS: 0
      POST: 1
      BUILD: 0
      LOG_LEVEL: warning
    networks:
      - socket_proxy_network
    mem_limit: 64m
    memswap_limit: 64m
    cpus: "0.1"
    mem_swappiness: 0
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2375/_ping 2>/dev/null | grep -q OK || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  traefik:
    image: traefik:v3.1.2
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    depends_on:
      - socket-proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - traefik_letsencrypt:/letsencrypt
      - traefik_dynamic:/etc/traefik/dynamic
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=stockix_public
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --ping=true
      - --ping.entrypoint=web
      - --certificatesresolvers.cloudflare.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.cloudflare.acme.dnschallenge=true
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
    networks:
      - stockix_public
      - stockix_internal
      - socket_proxy_network
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 1g
    cpus: "0.5"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-stockix_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-54330}:5432"
    networks:
      - stockix_public
    security_opt:
      - no-new-privileges:true

  # Dedicated Redis for control-plane BullMQ (license expiry milestones). Not shared with Chatwoot.
  control-plane-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    mem_limit: 320m
    memswap_limit: 320m
    cpus: "0.25"
    mem_swappiness: 0
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - stockix_internal
    security_opt:
      - no-new-privileges:true

  api:
    image: stockix-api:latest
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    # Single api container (deploy.replicas requires Docker Swarm; not used here).
    depends_on:
      postgres:
        condition: service_healthy
      control-plane-redis:
        condition: service_healthy
    environment:
      <<: *stockix-platform-env
      RUN_BULLMQ_CONSUMERS: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stockix_platform}
      PORT: "4000"
    networks:
      - stockix_public
      - stockix_internal
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
    labels:
      - traefik.enable=true
      - traefik.docker.network=stockix_public
      - "traefik.http.routers.stockix-api.rule=Host(`api.${ROOT_DOMAIN}`)"
      - traefik.http.routers.stockix-api.entrypoints=websecure
      - traefik.http.routers.stockix-api.tls.certresolver=cloudflare
      - traefik.http.services.stockix-api.loadbalancer.server.port=4000

  # Single BullMQ consumer — not exposed via Traefik. HTTP replicas use RUN_BULLMQ_CONSUMERS=false.
  api-bullmq:
    image: stockix-api:latest
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.25"
    depends_on:
      postgres:
        condition: service_healthy
      control-plane-redis:
        condition: service_healthy
    environment:
      <<: *stockix-platform-env
      RUN_BULLMQ_CONSUMERS: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stockix_platform}
      PORT: "4000"
    networks:
      - stockix_internal
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 6

  infra-worker:
    image: stockix-infra-worker:latest
    build:
      context: ../..
      dockerfile: infra/worker-service/Dockerfile
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    expose:
      - "9090"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      control-plane-redis:
        condition: service_healthy
      api:
        condition: service_healthy
      api-bullmq:
        condition: service_healthy
      socket-proxy:
        condition: service_healthy
    environment:
      <<: *stockix-worker-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stockix_platform}
    volumes:
      - ${STOCKIX_REPO:-../..}:/opt/stockix/stockixnew
      - traefik_dynamic:/opt/stockix/traefik-dynamic
      - stockix_tenants:/opt/stockix/tenants
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - stockix_public
      - stockix_internal
      - socket_proxy_network
    security_opt:
      - no-new-privileges:true

  dashboard:
    image: stockix-dashboard:latest
    build:
      context: ../..
      dockerfile: apps/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_STOCKIX_API_URL: ${NEXT_PUBLIC_STOCKIX_API_URL}
        NEXT_PUBLIC_STOCKIX_ROOT_DOMAIN: ${ROOT_DOMAIN}
        NEXT_PUBLIC_STOCKIX_PUBLIC_SCHEME: ${PUBLIC_BASE_URL_SCHEME:-https}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    mem_limit: 256m
    cpus: "0.25"
    restart: unless-stopped
    depends_on:
      traefik:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ORG: ${SENTRY_ORG:-}
      SENTRY_PROJECT: ${SENTRY_PROJECT:-}
      SESSION_SECRET: ${SESSION_SECRET}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD}
      PLATFORM_API_SECRET: ${PLATFORM_API_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stockix_platform}
      SECURITY_HSTS: ${SECURITY_HSTS}
      SECURITY_X_FRAME_OPTIONS: ${SECURITY_X_FRAME_OPTIONS}
      SECURITY_REFERRER_POLICY: ${SECURITY_REFERRER_POLICY}
      SECURITY_X_CONTENT_TYPE_OPTIONS: ${SECURITY_X_CONTENT_TYPE_OPTIONS}
      SECURITY_CSP_BASE: ${SECURITY_CSP_BASE}
    networks:
      - stockix_public
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    labels:
      - traefik.enable=true
      - traefik.docker.network=stockix_public
      - "traefik.http.routers.stockix-dash.rule=Host(`${ROOT_DOMAIN}`) || Host(`www.${ROOT_DOMAIN}`)"
      - traefik.http.routers.stockix-dash.entrypoints=websecure
      - traefik.http.routers.stockix-dash.tls.certresolver=cloudflare
      - traefik.http.routers.stockix-dash.tls.domains[0].main=${ROOT_DOMAIN}
      - traefik.http.routers.stockix-dash.tls.domains[0].sans=*.${ROOT_DOMAIN}
      - traefik.http.services.stockix-dash.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6

  db-backup:
    image: amazon/aws-cli:2.15.0
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./backup/backup.sh:/backup.sh:ro
    environment:
      BACKUP_B2_BUCKET: ${BACKUP_B2_BUCKET:-}
      BACKUP_B2_KEY_ID: ${BACKUP_B2_KEY_ID:-}
      BACKUP_B2_APP_KEY: ${BACKUP_B2_APP_KEY:-}
      BACKUP_B2_ENDPOINT: ${BACKUP_B2_ENDPOINT:-}
      BACKUP_B2_PREFIX: ${BACKUP_B2_PREFIX:-stockix-platform-backups}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_POSTGRES_CONTAINER: ${BACKUP_POSTGRES_CONTAINER:-stockix-postgres-1}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-stockix_platform}
    entrypoint:
      - sh
      - -c
      - |
        printf '%s\n' \
          '0 2 * * * /bin/bash /backup.sh >> /var/log/backup.log 2>&1' \
          '0 14 * * * /bin/bash /backup.sh >> /var/log/backup.log 2>&1' \
          | crontab -
        crond -f -l 2
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stockix_internal

networks:
  stockix_public:
    name: stockix_public
  stockix_internal:
    name: stockix_internal
    internal: true
  socket_proxy_network:
    internal: true
    driver: bridge

volumes:
  postgres_data:
  traefik_letsencrypt:
  traefik_dynamic:
  stockix_tenants:
