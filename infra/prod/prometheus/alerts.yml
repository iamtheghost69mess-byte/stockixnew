groups:
  - name: stockix.critical
    rules:
      - alert: ApiDown
        expr: up{job="api"} == 0
        for: 2m
        labels:
          severity: p0
        annotations:
          summary: "Control-plane API is down"
      - alert: PostgresDown
        expr: pg_up == 0
        for: 5m
        labels:
          severity: p1
      - alert: RedisDown
        expr: redis_up == 0
        for: 5m
        labels:
          severity: p1
      - alert: ProvisionFailureRate
        expr: rate(worker_jobs_failed_total[10m]) / rate(worker_jobs_total[10m]) > 0.2
        for: 10m
        labels:
          severity: p1
      - alert: DeadJobsAccumulating
        expr: worker_dead_jobs_total > 10
        labels:
          severity: p2
      - alert: DiskUsageHigh
        expr: (node_filesystem_size_bytes - node_filesystem_free_bytes) / node_filesystem_size_bytes > 0.85
        for: 10m
        labels:
          severity: p1
      - alert: BackupNotRunInLast26Hours
        # Fires when backup.sh has not written a success metric in 26 hours.
        # The metric is written by infra/prod/backup/backup.sh via node_exporter
        # textfile collector after each successful B2 upload.
        expr: (time() - stockix_backup_last_success_timestamp) > 93600
        for: 5m
        labels:
          severity: p1
        annotations:
          summary: "Postgres backup has not completed successfully in >26 hours"
      - alert: ApiLatencyHigh
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="api"}[5m])) > 2
        for: 5m
        labels:
          severity: p2
