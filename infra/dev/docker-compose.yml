# Local Stockix control-plane database + shared Redis for POS dev.
# Compose v2: `docker compose -f infra/dev/docker-compose.yml up -d`
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stockix_platform
    ports:
      # Host 5432 is often already taken by a local Postgres install — use 54330 for Stockix dev.
      - "54330:5432"
    volumes:
      - stockix_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stockix_platform"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  stockix_pg_data:
