services:
  pms-frontend:
    image: stockix-pms-frontend:local
    build:
      context: ${PMS_APP_ROOT}/frontend
    deploy:
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_PMS_API_URL=http://pms-api:3003
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.pms_frontend_${COMPOSE_PROJECT_NAME:-default}.rule=Host(`${PMS_FRONTEND_URL_HOST:-}`)"
        - "traefik.http.services.pms_frontend_${COMPOSE_PROJECT_NAME:-default}.loadbalancer.server.port=3000"
        - "traefik.docker.network=stockix_public"
    networks:
      - stockix_public
    mem_limit: 256m
    cpus: "0.25"
    mem_swappiness: 0
    oom_kill_disable: false

  pms-api:
    image: stockix-pms:local
    build:
      context: ${PMS_APP_ROOT}
    deploy:
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      - NODE_ENV=production
      - PMS_PORT=3003
      - DATABASE_URL=${DATABASE_URL}
      - AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET}
      - PLATFORM_API_SECRET=${PLATFORM_API_SECRET}
      - TENANT_ID=${TENANT_ID}
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.pms_${COMPOSE_PROJECT_NAME:-default}.rule=Host(`${PUBLIC_APP_URL_HOST:-}`)"
        - "traefik.http.services.pms_${COMPOSE_PROJECT_NAME:-default}.loadbalancer.server.port=3003"
        - "traefik.docker.network=stockix_public"
    networks:
      - stockix_public
      - stockix-shared
    mem_limit: 512m
    cpus: "0.5"
    mem_swappiness: 0
    oom_kill_disable: false

volumes: {}

networks:
  # Traefik public network — external, managed by infra/prod/docker-compose.yml
  stockix_public:
    name: stockix_public
    external: true
  stockix-shared:
    name: stockix-shared
    external: true