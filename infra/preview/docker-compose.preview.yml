# Lightweight preview stack for pull request environments.
# Runs API + Dashboard only — no Finance stack (too heavy for preview).
# Database: shared preview Postgres with a per-PR schema prefix.
# Deployed by: infra/preview/deploy-preview.sh
# Torn down by: infra/preview/teardown-preview.sh

services:
  api:
    image: ${GHCR_NAMESPACE}/api:pr-${PR_NUMBER}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${PREVIEW_DATABASE_URL}
      REDIS_URL: ${PREVIEW_REDIS_URL}
      CONTROL_PLANE_REDIS_URL: ${PREVIEW_REDIS_URL}
      JWT_SECRET: ${PREVIEW_JWT_SECRET}
      PORT: "4000"
      ROOT_DOMAIN: pr-${PR_NUMBER}.preview.${ROOT_DOMAIN}
      DASHBOARD_URL: https://dashboard.pr-${PR_NUMBER}.preview.${ROOT_DOMAIN}
      RUN_BULLMQ_CONSUMERS: "false"
      WORKER_SECRET: ${PREVIEW_WORKER_SECRET}
    networks:
      - preview_internal
      - preview_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-pr-${PR_NUMBER}.rule=Host(`api.pr-${PR_NUMBER}.preview.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.api-pr-${PR_NUMBER}.entrypoints=websecure"
      - "traefik.http.routers.api-pr-${PR_NUMBER}.tls.certresolver=cloudflare"
      - "traefik.http.services.api-pr-${PR_NUMBER}.loadbalancer.server.port=4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health 2>/dev/null | grep -q ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  dashboard:
    image: ${GHCR_NAMESPACE}/dashboard:pr-${PR_NUMBER}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
    networks:
      - preview_internal
      - preview_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard-pr-${PR_NUMBER}.rule=Host(`dashboard.pr-${PR_NUMBER}.preview.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.dashboard-pr-${PR_NUMBER}.entrypoints=websecure"
      - "traefik.http.routers.dashboard-pr-${PR_NUMBER}.tls.certresolver=cloudflare"
      - "traefik.http.services.dashboard-pr-${PR_NUMBER}.loadbalancer.server.port=3000"

networks:
  preview_internal:
    name: preview_internal_pr_${PR_NUMBER}
    internal: true
  preview_public:
    name: preview_public_pr_${PR_NUMBER}
    external: true
