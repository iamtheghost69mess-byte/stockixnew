      x-stockix-min-role: super_admin
  /licenses/{licenseId}/revoke:
    post:
      tags:
      - CP-Licenses
      summary: Revoke license
      description: Deactivates devices; triggers Finance+POS sync
      parameters:
      - $ref: '#/components/parameters/LicenseIdPath'
      responses:
        '200':
          description: HTTP 200
        '400':
          description: HTTP 400
        '404':
          description: HTTP 404
        '409':
          description: HTTP 409
      x-stockix-min-role: super_admin
  /licenses/{licenseId}/activations/{activationId}/deactivate:
    post:
      tags:
      - CP-Licenses
      summary: Deactivate device activation
      parameters:
      - $ref: '#/components/parameters/LicenseIdPath'
      - name: activationId
        in: path
        required: true
        schema:
          format: uuid
      responses:
        '200':
          description: HTTP 200
        '400':
          description: HTTP 400
        '404':
          description: HTTP 404
        '409':
          description: HTTP 409
      x-stockix-min-role: support_agent
  /fingerprints/blacklist:
    post:
      tags:
      - CP-Fingerprints
      summary: Blacklist hardware fingerprint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - hardwareFingerprint
              properties:
                hardwareFingerprint:
                  type: string
                reason:
                  type: string
      responses:
        '200':
          description: HTTP 200
        '400':
          description: HTTP 400
      x-stockix-min-role: super_admin
  /tenants:
    get:
      tags:
      - CP-Tenants
      summary: List tenants
      responses:
        '200':
          description: HTTP 200
      x-stockix-min-role: read_only
    post:
      tags:
      - CP-Tenants
      summary: Provision tenant (async)
      description: 202 accepted. Poll /tenants/provision-status/{correlationId}.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionTenantRequest'
      responses:
        '202':
          description: HTTP 202
        '400':
          description: HTTP 400
        '409':
          description: HTTP 409
      x-stockix-min-role: super_admin
  /tenants/export.csv:
    get:
      tags:
      - CP-Tenants
      summary: Export tenants CSV
      responses:
        '200':
          description: CSV
      x-stockix-min-role: read_only
  /tenants/provision-status/{correlationId}:
    get:
      tags:
      - CP-Tenants
      summary: Poll provision status
      parameters:
      - $ref: '#/components/parameters/CorrelationIdPath'
      responses:
