components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: stockix-session
      description: Owner dashboard HttpOnly session cookie.
    BearerSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Owner session JWT.
    PlatformApiSecret:
      type: http
      scheme: bearer
      description: Bearer PLATFORM_API_SECRET.
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: sk_live_
      description: Read-only platform API key.
    WorkerSecret:
      type: http
      scheme: bearer
      description: Bearer WORKER_SECRET for internal worker routes.
    PmsProductJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Product JWT (AUTH_TOKEN_SECRET, module pms).
    PmsInternalBypass:
      type: apiKey
      in: header
      name: x-stockix-tenant-id
      description: UUID tenant; pair with x-stockix-internal-secret = PLATFORM_API_SECRET.
  parameters:
    TenantIdPath:
      name: tenantId
      in: path
      required: true
      schema:
        format: uuid
    LicenseIdPath:
      name: licenseId
      in: path
      required: true
      schema:
        format: uuid
    PlanIdPath:
      name: planId
      in: path
      required: true
      schema:
        format: uuid
    CorrelationIdPath:
      name: correlationId
      in: path
      required: true
      schema:
        format: uuid
    OwnerIdPath:
      name: ownerId
      in: path
      required: true
      schema:
        format: uuid
    OrgIdPath:
      name: orgId
      in: path
      required: true
      schema:
        format: uuid
    JobIdPath:
      name: jobId
      in: path
      required: true
      schema:
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
      description: Required for POST/PATCH/DELETE on /owners/* and /tenants/*.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        detail:
          type: object
          additionalProperties: true
    OwnerRole:
      type: string
      enum:
      - read_only
      - support_agent
      - billing_manager
      - super_admin
    StockixModule:
      type: string
      enum:
      - accounting
      - pos
      - pms
      - chat
    LicenseProduct:
      type: string
      enum:
      - platform
      - pos_desktop
      - bundle
    LicenseModule:
      type: string
      enum:
      - accounting
      - pos
      - pms
      - chat
    LicenseStatus:
      type: string
      enum:
      - unassigned
      - active
      - revoked
      - expired
    Plan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        maxOrganizations:
          type: integer
        maxActivations:
          type: integer
        maxUsers:
          type: integer
        isActive:
          type: boolean
        features:
          type: array
          items:
            type: string
    LicenseSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        licenseKey:
          type: string
        product:
          $ref: '#/components/schemas/LicenseProduct'
        planSlug:
          type: string
        status:
          $ref: '#/components/schemas/LicenseStatus'
        tenantId:
          type: string
          format: uuid
          nullable: true
        maxActivations:
          type: integer
        activationCount:
          type: integer
        isPerpetual:
          type: boolean
        expiresAt:
          type: string
          format: date-time
          nullable: true
        modules:
          type: array
          items:
            $ref: '#/components/schemas/LicenseModule'
    ProvisionTenantRequest:
      type: object
      required:
      - slug
      - name
      - owner_id
      - admin_email
      - admin_first_name
      - admin_last_name
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        name:
          type: string
        owner_id:
          type: string
          format: uuid
        admin_email:
          type: string
          format: email
        admin_first_name:
          type: string
        admin_last_name:
          type: string
        plan_slug:
          type: string
          default: starter
        modules:
          type: array
          items:
            $ref: '#/components/schemas/StockixModule'
          default:
          - accounting
        assign_existing_license_id:
          type: string
          format: uuid
    ActivateLicenseRequest:
      type: object
      required:
      - licenseKey
      - hardwareFingerprint
      properties:
        licenseKey:
          type: string
        hardwareFingerprint:
          type: string
          minLength: 8
          maxLength: 256
        machineName:
          type: string
          maxLength: 120
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
