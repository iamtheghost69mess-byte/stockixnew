      x-stockix-min-role: support_agent
  /tenants/{tenantId}/provision-stop:
    post:
      tags:
      - CP-Tenants
      summary: Stop provision for tenant
      parameters:
      - $ref: '#/components/parameters/TenantIdPath'
      responses:
        '200':
          description: HTTP 200
        '202':
          description: HTTP 202
        '400':
          description: HTTP 400
        '404':
          description: HTTP 404
        '409':
          description: HTTP 409
        '503':
          description: HTTP 503
      x-stockix-min-role: support_agent
  /tenants/{tenantId}:
    get:
      tags:
      - CP-Tenants
      summary: Tenant detail
      parameters:
      - $ref: '#/components/parameters/TenantIdPath'
      responses:
        '200':
          description: HTTP 200
        '202':
          description: HTTP 202
        '400':
          description: HTTP 400
        '404':
          description: HTTP 404
        '409':
          description: HTTP 409
        '503':
          description: HTTP 503
      x-stockix-min-role: read_only
    patch:
      tags:
      - CP-Tenants
      summary: Update tenant
      parameters:
      - $ref: '#/components/parameters/TenantIdPath'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: HTTP 200
        '202':
          description: HTTP 202
        '400':
          description: HTTP 400
        '404':
          description: HTTP 404
        '409':
          description: HTTP 409
        '503':
          description: HTTP 503
      x-stockix-min-role: super_admin
    delete:
      tags:
      - CP-Tenants
      summary: Delete tenant
      parameters:
      - $ref: '#/components/parameters/TenantIdPath'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: HTTP 200
        '202':
          description: HTTP 202
        '400':
          description: HTTP 400
        '404':
          description: HTTP 404
        '409':
          description: HTTP 409
        '503':
          description: HTTP 503
      x-stockix-min-role: super_admin
  /tenants/{tenantId}/retry-provision:
    post:
      tags:
      - CP-Tenants
      summary: Retry provision
      parameters:
      - $ref: '#/components/parameters/TenantIdPath'
      responses:
        '200':
          description: HTTP 200
        '202':
          description: HTTP 202
        '400':
          description: HTTP 400
        '404':
