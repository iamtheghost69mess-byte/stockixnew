  /plans:
    get:
      tags:
      - CP-Plans
      summary: List plans
      responses:
        '200':
          description: Plan catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plan'
      x-stockix-min-role: read_only
    post:
      tags:
      - CP-Plans
      summary: Create plan
      description: 409 SLUG_EXISTS if slug taken. Cannot deactivate plan with active licenses (DELETE).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - slug
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                slug:
                  type: string
                maxOrganizations:
                  type: integer
                  default: 1
                maxActivations:
                  type: integer
                  default: 1
                maxUsers:
                  type: integer
                  default: 999
                isPerpetual:
                  type: boolean
                features:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: HTTP 201
        '400':
          description: HTTP 400
        '409':
          description: HTTP 409
      x-stockix-min-role: super_admin
  /plans/{planId}:
    patch:
      tags:
      - CP-Plans
      summary: Update plan
      parameters:
      - $ref: '#/components/parameters/PlanIdPath'
      responses:
        '200':
          description: HTTP 200
        '400':
          description: HTTP 400
        '404':
          description: HTTP 404
      x-stockix-min-role: super_admin
    delete:
      tags:
      - CP-Plans
      summary: Deactivate plan
      description: Soft delete (isActive=false). 409 PLAN_IN_USE.
      parameters:
      - $ref: '#/components/parameters/PlanIdPath'
      responses:
        '200':
          description: HTTP 200
        '404':
          description: HTTP 404
        '409':
          description: HTTP 409
      x-stockix-min-role: super_admin
  /licenses/generate:
    post:
      tags:
      - CP-Licenses
      summary: Generate license keys
      description: If tenantId set, licenses are active immediately and tenant planSlug updated. expiresAt required when isPerpetual=false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - product
              - planSlug
              properties:
                product:
                  $ref: '#/components/schemas/LicenseProduct'
                modules:
                  type: array
                  items:
                    $ref: '#/components/schemas/LicenseModule'
                planSlug:
                  type: string
                count:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 1
                isPerpetual:
                  type: boolean
                  default: true
                expiresAt:
                  type: string
                  format: date-time
                validFrom:
                  type: string
                  format: date-time
                maxActivations:
                  type: integer
                  minimum: 1
                  maximum: 50
                gracePeriodDays:
                  type: integer
                  minimum: 0
                  maximum: 365
                  default: 7
                notes:
                  type: string
                  maxLength: 500
                tenantId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: HTTP 201
        '400':
          description: HTTP 400
        '404':
          description: HTTP 404
      x-stockix-min-role: super_admin
  /licenses:
    get:
      tags:
      - CP-Licenses
      summary: List licenses
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: product
        in: query
        required: false
        schema:
          type: string
      - name: planSlug
        in: query
        required: false
        schema:
          type: string
      - name: tenantId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: primary
        in: query
        required: false
        schema:
          type: string
          description: With tenantId returns canonical license
      - name: expiringInDays
        in: query
        required: false
        schema:
          type: integer
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: Paginated licenses
          content:
            application/json:
              schema:
                type: object
                properties:
                  licenses:
                    type: array
                    items:
                      $ref: '#/components/schemas/LicenseSummary'
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
      x-stockix-min-role: read_only
  /licenses/analytics:
    get:
      tags:
      - CP-Licenses
      summary: License analytics
      responses:
        '200':
          description: HTTP 200
      x-stockix-min-role: read_only
  /licenses/export.csv:
    get:
      tags:
      - CP-Licenses
      summary: Export licenses CSV
      responses:
        '200':
          description: text/csv attachment
      x-stockix-min-role: read_only
  /licenses/activate:
    post:
      tags:
      - CP-Licenses
      summary: Activate license on device
      description: 'Public. Edge cases: device_blacklisted, license_not_assigned, max_activations_reached, license_not_yet_valid,
        license_revoked, license_expired.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateLicenseRequest'
      responses:
        '200':
          description: HTTP 200
        '400':
          description: HTTP 400
        '403':
          description: HTTP 403
        '404':
          description: HTTP 404
  /licenses/verify-offline:
    post:
      tags:
      - CP-Licenses
      summary: Verify offline token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - offlineToken
              - hardwareFingerprint
              properties:
                offlineToken:
                  type: string
                hardwareFingerprint:
                  type: string
      responses:
        '200':
          description: HTTP 200
        '401':
          description: HTTP 401
        '403':
          description: HTTP 403
        '404':
          description: HTTP 404
  /licenses/{licenseId}:
    get:
      tags:
      - CP-Licenses
      summary: License detail
      parameters:
      - $ref: '#/components/parameters/LicenseIdPath'
      responses:
        '200':
          description: HTTP 200
        '400':
          description: HTTP 400
        '404':
          description: HTTP 404
        '409':
          description: HTTP 409
      x-stockix-min-role: read_only
    patch:
      tags:
      - CP-Licenses
      summary: Update license notes
      description: notes max 2000
      parameters:
      - $ref: '#/components/parameters/LicenseIdPath'
      responses:
        '200':
          description: HTTP 200
        '400':
          description: HTTP 400
        '404':
          description: HTTP 404
        '409':
          description: HTTP 409
      x-stockix-min-role: billing_manager
  /licenses/{licenseId}/history:
    get:
      tags:
      - CP-Licenses
      summary: License audit history
      description: Paginated page/pageSize max 100
      parameters:
      - $ref: '#/components/parameters/LicenseIdPath'
      responses:
        '200':
          description: HTTP 200
        '400':
