openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Stockix Platform APIs
  version: 1.0.0
  description: 'OpenAPI 3.1 derived from Stockix monorepo backend source. Only documents routes present in code.


    | Service | Base URL | Coverage |

    |---|---|---|

    | Control Plane | http://localhost:4000 | This file (full) |

    | PMS | http://localhost:3003 | This file (full) |

    | Finance | https://{tenant}.stockix.cloud/api | NOT PROVIDED — services/stockix-finance/shared/sdk-ts/openapi.json or
    /swagger |

    | POS Tenant | http://localhost:8010 | NOT PROVIDED — services/posnew/apps/pos-backend/openapi/tenant-pos-v1.yaml |

    | POS Platform | http://localhost:8010/api/platform/v1 | NOT PROVIDED — services/posnew/apps/pos-backend/openapi/platform-v1.yaml
    |

    | Chatlive | CHATWOOT_BASE_URL | NOT PROVIDED — services/chatlive/swagger/swagger.json |


    RBAC rank: read_only < support_agent < billing_manager < super_admin.

    Dedicated license suspend endpoint: NOT PROVIDED (use revoke or tenant suspend).'
servers:
- url: http://localhost:4000
  description: Stockix Control Plane API
- url: http://localhost:3003
  description: PMS service
tags:
- name: CP-Health
- name: CP-Public
- name: CP-Auth
- name: CP-Internal
- name: CP-Owners
- name: CP-API-Keys
- name: CP-Tenants
- name: CP-Organizations
- name: CP-Finance-Users
- name: CP-POS-Proxy
- name: CP-POS-Credentials
- name: CP-PMS-Proxy
- name: CP-Plans
- name: CP-Licenses
- name: CP-Fingerprints
- name: CP-Audit
- name: CP-Search
- name: PMS-Properties
- name: PMS-Rooms
- name: PMS-Bookings
- name: PMS-Guests
- name: PMS-Payments
- name: PMS-Channels
- name: PMS-Cleaning
- name: PMS-Staff
- name: PMS-Reports
- name: PMS-Calendar
- name: PMS-Templates
- name: PMS-DateOverrides
- name: PMS-Public
security:
- SessionCookie: []
- BearerSession: []
- PlatformApiSecret: []
paths:
  /health:
    get:
      tags:
      - CP-Health
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  service:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
  /public/tenant-orgs/{tenantId}:
    get:
      tags:
      - CP-Public
      summary: List active organizations (public)
      description: No auth. Returns publicUrl per org for onboarding UIs.
      security: []
      parameters:
      - $ref: '#/components/parameters/TenantIdPath'
      responses:
        '200':
          description: HTTP 200
        '400':
          description: HTTP 400
        '503':
          description: HTTP 503
  /auth/session/validate:
    post:
      tags:
      - CP-Auth
      summary: Validate session
      description: Public auth surface. Mutating routes enforce CSRF via Origin header unless Authorization is present. Rate
        limits apply to login, MFA verify, invite accept, password reset.
      security: []
      responses:
        '200':
          description: HTTP 200
        '400':
          description: HTTP 400
        '401':
          description: HTTP 401
        '403':
          description: HTTP 403
        '429':
          description: HTTP 429
  /auth/login:
    post:
