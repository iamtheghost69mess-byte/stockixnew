name: Feature request
description: Propose a new capability or improvement.
title: "[feat] "
labels: [enhancement, triage]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Control plane API
        - Dashboard
        - Worker / provisioning
        - PMS
        - POS
        - Finance (Stockix accounting)
        - Production infra / CI
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator need does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: impact
    attributes:
      label: Tenancy / licensing / RBAC impact
      description: Who should access this? Does it affect tenant provisioning, license limits, or module gating?
    validations:
      required: true
