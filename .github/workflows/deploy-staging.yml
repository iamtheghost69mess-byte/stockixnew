name: Deploy Staging

on:
  workflow_run:
    workflows: ["Build and Publish Images"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy-staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/reusable/deploy-stack.yml
    with:
      environment: staging
      release_sha: ${{ github.event.workflow_run.head_sha }}
    secrets:
      SSH_HOST: ${{ secrets.STAGING_EC2_HOST }}
      SSH_USER: ${{ secrets.STAGING_EC2_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
