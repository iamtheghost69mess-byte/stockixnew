name: Deploy Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: stockix-staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality gate
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  deploy-staging:
    name: Deploy to staging
    needs: quality-gate
    if: github.ref == 'refs/heads/staging' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      - name: Deploy over SSH
        env:
          STAGING_EC2_HOST: ${{ secrets.STAGING_EC2_HOST }}
          STAGING_EC2_USER: ${{ secrets.STAGING_EC2_USER }}
          ROOT_DOMAIN: ${{ secrets.ROOT_DOMAIN }}
        run: |
          set -euo pipefail
          test -n "${STAGING_EC2_HOST:-}" && test -n "${STAGING_EC2_USER:-}"
          ssh -o StrictHostKeyChecking=accept-new "${STAGING_EC2_USER}@${STAGING_EC2_HOST}" bash -s << 'REMOTE'
          set -euo pipefail
          export CI=true
          export PNPM_CONFIG_CONFIRM_MODULES_PURGE=false
          cd /opt/stockix/stockixnew
          REPO_ROOT="$(pwd)"
          PREV_API="$(docker image inspect stockix-api:latest --format '{{.Id}}' 2>/dev/null || true)"
          PREV_DASH="$(docker image inspect stockix-dashboard:latest --format '{{.Id}}' 2>/dev/null || true)"
          PREV_WORKER="$(docker image inspect stockix-infra-worker:latest --format '{{.Id}}' 2>/dev/null || true)"
          rollback() {
            echo "Deploy failed — attempting rollback to previous images."
            if [ -d "${REPO_ROOT}/infra/staging" ]; then
              cd "${REPO_ROOT}/infra/staging"
              docker compose --env-file .env logs --tail=300 || true
            fi
            rolled_back=0
            if [ -n "${PREV_API:-}" ]; then
              docker tag "${PREV_API}" stockix-api:latest 2>/dev/null || true
              rolled_back=1
            fi
            if [ -n "${PREV_DASH:-}" ]; then
              docker tag "${PREV_DASH}" stockix-dashboard:latest 2>/dev/null || true
              rolled_back=1
            fi
            if [ -n "${PREV_WORKER:-}" ]; then
              docker tag "${PREV_WORKER}" stockix-infra-worker:latest 2>/dev/null || true
              rolled_back=1
            fi
            if [ "$rolled_back" -eq 1 ] && [ -d "${REPO_ROOT}/infra/staging" ]; then
              cd "${REPO_ROOT}/infra/staging"
              docker compose --env-file .env up -d --no-build \
                api api-bullmq dashboard infra-worker || true
              echo "Rolled back to previous images."
            else
              echo "No previous images to roll back to."
            fi
            exit 1
          }
          trap rollback ERR
          fetch_origin() {
            if git fetch --prune --force origin; then
              return 0
            fi
            echo "git fetch failed; clearing stale origin remote-tracking refs..."
            git remote prune origin || true
            git for-each-ref --format='%(refname)' refs/remotes/origin \
              | while read -r ref; do git update-ref -d "$ref" || true; done
            git fetch --prune --force origin
          }
          fetch_origin
          git checkout staging
          git merge --ff-only origin/staging
          echo "Deploy commit: $(git rev-parse HEAD)"
          chmod +x scripts/load-env-file.sh 2>/dev/null || true
          # IMPORTANT: Never use 'source infra/staging/.env' — semicolons in values break bash.
          # shellcheck disable=SC1091
          . scripts/load-env-file.sh infra/staging/.env
          export DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_HOST_PORT:-54330}/${POSTGRES_DB:-stockix_platform}"
          corepack enable && corepack prepare pnpm@9.15.9 --activate
          rm -rf node_modules
          # infra/staging/.env sets NODE_ENV=production; pnpm skips devDependencies (tsx for db:migrate).
          NODE_ENV=development pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @repo/db db:migrate
          pnpm --filter @repo/db exec tsx scripts/verify-schema.ts
          cd infra/staging
          export COMPOSE_FILE=docker-compose.yml
          export COMPOSE_PARALLEL_LIMIT=1
          docker compose --env-file .env build --progress=plain api dashboard infra-worker
          echo "=== Verifying images exist ==="
          for img in stockix-api:latest stockix-dashboard:latest stockix-infra-worker:latest; do
            if ! docker image inspect "$img" >/dev/null 2>&1; then
              echo "Missing image: $img — Docker build failed. Check logs above."
              exit 1
            fi
            echo "OK: $img"
          done
          docker compose --env-file .env pull traefik socket-proxy
docker compose --env-file .env up -d --no-build --wait \
  traefik postgres control-plane-redis socket-proxy api api-bullmq dashboard infra-worker db-backup
          sleep 10
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            "${PUBLIC_BASE_URL_SCHEME:-https}://${API_DOMAIN}/ready" >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            "${DASHBOARD_URL}/" >/dev/null
          cd "${REPO_ROOT}"
          echo "=== Building tenant images ==="
          pnpm docker:prebuild 2>&1 | tail -20 || \
            echo "WARNING: Tenant images build failed — provisioning may not work until pnpm docker:prebuild succeeds"
          trap - ERR
          echo "Staging deploy completed successfully."
          REMOTE

      - name: Verify staging health
        env:
          ROOT_DOMAIN: ${{ secrets.ROOT_DOMAIN }}
        run: |
          sleep 15
          curl --fail --retry 5 --retry-delay 5 \
            "https://staging-api.${ROOT_DOMAIN}/ready"
