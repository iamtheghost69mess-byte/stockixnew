name: Layer 1 Network Architecture Gate
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  enforce-swarm-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Forbid loopback ports in Compose files
        run: |
          if grep -rn "127.0.0.1:" infra/tenant-stack/ infra/pos-tenant-stack/ infra/pms-tenant-stack/; then
            echo "ERROR: Loopback ports (127.0.0.1) found in tenant compose files. Tenant stacks must rely on Swarm DNS routing via Traefik labels."
            exit 1
          fi

      - name: Forbid legacy dynamic compose spawning
        run: |
          if grep -rn "execa.*docker.*compose.*up" infra/worker-service/domain/provisioning/; then
            echo "ERROR: Found dynamic docker-compose up execution. Tenant stacks must be deployed via docker stack deploy."
            exit 1
          fi

      - name: Forbid loopback URLs in tenant proxy API
        run: |
          if grep -rn "localhost:[0-9]" apps/api/src/pos-proxy.ts apps/api/src/pos-public-url.ts apps/api/src/pms-proxy.ts apps/api/src/routes/pos-proxy-http.ts apps/api/src/routes/pms-proxy-http.ts; then
            echo "ERROR: Localhost port hardcoding found in API proxy logic. Use buildTenantServiceUrl from @repo/shared/tenant-dns."
            exit 1
          fi

      - name: Fail on localhost/127.0.0.1 in container runtime code
        run: |
          FOUND=$(grep -rn "127\.0\.0\.1\|localhost" \
            apps/api/src/ \
            apps/pos-backend/config/ \
            infra/worker-service/src/ \
            infra/worker-service/domain/ \
            services/stockix-finance/packages/server/src/ \
            --include="*.ts" \
            --include="*.js" \
            --exclude-dir=node_modules \
            --exclude="*.test.ts" \
            --exclude="*.spec.ts" \
            | grep -vE "^[^:]+:[0-9]+:\s*[*/]" \
            | grep -v "!== 'localhost'" \
            | grep -v '!== "localhost"' \
            | grep -v "!== '127\." \
            | grep -v '!== "127\.' \
            | grep -v " === 'localhost'" \
            | grep -v ' === "localhost"' \
            | grep -v "=== '127\." \
            | grep -v '=== "127\.' \
            | grep -v "@localhost" \
            | grep -v "origins\.add" \
            | grep -v "hostname ===" \
            | grep -v "endsWith.*localhost" \
            | grep -v "includes.*localhost" \
            | grep -v "rootDomain.*localhost" \
            | grep -v "connectSrc" \
            | grep -v "curl " \
            | grep -v "logger\." \
            | grep -v "opts\.log" \
            | grep -v "OTEL_EXPORTER" \
            | grep -vE '"[^"]*localhost[^"]*"' \
            | grep -vE "'[^']*localhost[^']*'" \
            | grep -vE '"[^"]*127\.[0-9]+\.[0-9]+\.[0-9]+[^"]*"' \
            | grep -vE "'[^']*127\.[0-9]+\.[0-9]+\.[0-9]+[^']*'" \
            | grep -vE '`http://127\.[0-9]' \
            | grep -v "mongodb://localhost" \
            | grep -v "// localhost only" \
            || true)
          if [ -n "$FOUND" ]; then
            echo "ERROR: Localhost or 127.0.0.1 found in container runtime code (routing violation):"
            echo "$FOUND"
            exit 1
          fi

      - name: Fail on host-bound ports in prod compose
        run: |
          echo "Scanning for host-bound ports in infra/prod/docker-compose.yml..."
          FOUND=$(grep -n '"\?[0-9]\+\.[0-9]\+\.[0-9]\+\.[0-9]\+:[0-9]\+:[0-9]\+' \
            infra/prod/docker-compose.yml \
            || true)
          if [ -n "$FOUND" ]; then
            echo "NETWORK GATE VIOLATION: Host-bound ports found in prod compose:"
            echo "$FOUND"
            exit 1
          fi
          echo "Clean."

      - name: Fail on Swarm deploy attributes in dev compose
        run: |
          echo "Scanning for Swarm deploy attributes in infra/dev/..."
          FOUND=$(grep -rn "^\s*deploy:" \
            infra/dev/ \
            || true)
          if [ -n "$FOUND" ]; then
            echo "NETWORK GATE VIOLATION: Swarm deploy: attributes found in dev compose:"
            echo "$FOUND"
            exit 1
          fi
          echo "Clean."

      - name: Fail on ProxySQL port contract violations
        run: |
          echo "Scanning for ProxySQL port contract violations..."
          # Tenant services must never connect to admin port 6032
          # Only the worker provisioner may use 6032
          FOUND=$(grep -rn "port.*6032\|6032.*port" \
            infra/tenant-stack/ \
            infra/pos-tenant-stack/ \
            infra/pms-tenant-stack/ \
            services/stockix-finance/packages/server/src/ \
            apps/pos-backend/ \
            --include="*.ts" \
            --include="*.js" \
            --include="*.yml" \
            --include="*.yaml" \
            || true)
          if [ -n "$FOUND" ]; then
            echo "NETWORK GATE VIOLATION: ProxySQL admin port 6032 used in tenant service (only worker may use 6032):"
            echo "$FOUND"
            exit 1
          fi
          echo "Clean."

      - name: Check pass
        run: echo "Network architecture validation passed."
