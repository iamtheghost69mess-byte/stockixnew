name: Build and Publish Images

on:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  gate-checks:
    name: Run All Architecture Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on localhost/127.0.0.1 in container runtime code
        run: |
          FOUND=$(grep -rn "127\.0\.0\.1\|localhost" \
            apps/api/src/ \
            apps/pos-backend/config/ \
            infra/worker-service/src/ \
            infra/worker-service/domain/ \
            services/stockix-finance/packages/server/src/ \
            --include="*.ts" \
            --include="*.js" \
            --exclude-dir=node_modules \
            --exclude="*.test.ts" \
            --exclude="*.spec.ts" \
            | grep -v "mongodb://localhost" \
            | grep -v "localhost only valid in dev" \
            || true)
          if [ -n "$FOUND" ]; then
            echo "GATE FAILURE: localhost or 127.0.0.1 found in container runtime code:"
            echo "$FOUND"
            exit 1
          fi

      - name: Fail on unapproved Node versions in Dockerfiles
        run: |
          FOUND=$(grep -rn "FROM node:" \
            --include="Dockerfile" \
            --include="Dockerfile.*" \
            . \
            | grep -v "node:22-alpine" \
            | grep -v "node:22-bookworm-slim" \
            || true)
          if [ -n "$FOUND" ]; then
            echo "GATE FAILURE: Unapproved Node base image:"
            echo "$FOUND"
            exit 1
          fi

      - name: Fail on host-bound ports in prod compose
        run: |
          FOUND=$(grep -n '"\?[0-9]\+\.[0-9]\+\.[0-9]\+\.[0-9]\+:[0-9]\+:[0-9]\+' \
            infra/prod/docker-compose.yml \
            || true)
          if [ -n "$FOUND" ]; then
            echo "GATE FAILURE: Host-bound ports in prod compose:"
            echo "$FOUND"
            exit 1
          fi

      - name: Fail on docker compose up in worker code
        run: |
          FOUND=$(grep -rn "docker compose up\|docker-compose up" \
            infra/worker-service/src/ \
            infra/worker-service/domain/ \
            --include="*.ts" \
            --exclude="*.test.ts" \
            || true)
          if [ -n "$FOUND" ]; then
            echo "GATE FAILURE: docker compose up found in worker (must use docker stack deploy):"
            echo "$FOUND"
            exit 1
          fi

      - name: Verify all boot validators exist
        run: |
          test -f apps/api/src/env.ts || { echo "GATE FAILURE: apps/api/src/env.ts missing"; exit 1; }
          test -f apps/pos-backend/env-validate-boot.js || { echo "GATE FAILURE: apps/pos-backend/env-validate-boot.js missing"; exit 1; }
          test -f services/pms/src/env.ts || { echo "GATE FAILURE: services/pms/src/env.ts missing"; exit 1; }
          test -f services/stockix-finance/packages/server/src/env.ts || { echo "GATE FAILURE: services/stockix-finance/packages/server/src/env.ts missing"; exit 1; }
          test -f infra/worker-service/src/env.ts || { echo "GATE FAILURE: infra/worker-service/src/env.ts missing"; exit 1; }
          echo "All boot validators present."

      - name: Setup Node and pnpm for typecheck
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript compilation check — API
        run: pnpm --filter api exec tsc --noEmit

      - name: TypeScript compilation check — Worker
        run: pnpm --filter ./infra/worker-service exec tsc --noEmit

      - name: TypeScript compilation check — PMS
        run: pnpm --filter @stockix/pms exec tsc --noEmit

      - name: TypeScript compilation check — Finance
        run: pnpm --filter @stockix/server exec tsc --noEmit

  build-images:
    name: Build and Push Docker Images
    needs: [gate-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push shared base image
        if: false # DEPRECATED: stockix-base eliminated in Layer 2 repair
        uses: docker/build-push-action@v6
        with:
          context: infra/docker/base
          file: infra/docker/base/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/stockix-base:node22
            ghcr.io/${{ github.repository }}/stockix-base:node22-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/stockix-base:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/stockix-base:cache,mode=max

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/stockix-api:${{ github.sha }}
            ghcr.io/${{ github.repository }}/stockix-api:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/stockix-api:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/stockix-api:cache,mode=max

      - name: Build & push Dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dashboard/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/stockix-dashboard:${{ github.sha }}
            ghcr.io/${{ github.repository }}/stockix-dashboard:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/stockix-dashboard:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/stockix-dashboard:cache,mode=max

      - name: Build & push Infra Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/worker-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/stockix-infra-worker:${{ github.sha }}
            ghcr.io/${{ github.repository }}/stockix-infra-worker:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/stockix-infra-worker:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/stockix-infra-worker:cache,mode=max

      - name: Build & push Finance Server
        uses: docker/build-push-action@v6
        with:
          context: services/stockix-finance
          file: services/stockix-finance/packages/server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/stockix-finance-server:${{ github.sha }}
            ghcr.io/${{ github.repository }}/stockix-finance-server:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/stockix-finance-server:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/stockix-finance-server:cache,mode=max
