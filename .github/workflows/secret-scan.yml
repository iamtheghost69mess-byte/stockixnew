name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repository hygiene — block tracked local env files
        run: |
          set -euo pipefail
          tracked_env_files="$(git ls-files | grep -E '(^|/)\.env($|(\.[^/]+)$)' | grep -Ev '\.env\.example$' || true)"
          if [ -n "${tracked_env_files}" ]; then
            echo "Tracked .env files are not allowed in repository history:"
            echo "${tracked_env_files}"
            exit 1
          fi

      - name: Repository hygiene — block tracked build artifacts
        run: |
          set -euo pipefail
          tracked_generated="$(git ls-files | grep -E '(^|/)(\.next/|dist/|build/|coverage/|\.runtime/|\.tmp-worker/)' || true)"
          if [ -n "${tracked_generated}" ]; then
            echo "Tracked generated artifacts detected (must not be committed):"
            echo "${tracked_generated}"
            exit 1
          fi

      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Determine scan range
        id: range
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "log_opts=origin/${{ github.base_ref }}..HEAD" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            echo "log_opts=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "log_opts=--all" >> "$GITHUB_OUTPUT"
          fi

      - name: Run gitleaks
        id: scan
        run: |
          set +e
          gitleaks git \
            --redact \
            --verbose \
            --exit-code 2 \
            --config .gitleaks.toml \
            --report-format sarif \
            --report-path gitleaks-results.sarif \
            --log-opts "${{ steps.range.outputs.log_opts }}"
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload SARIF to Security tab
        if: always() && hashFiles('gitleaks-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks-results.sarif

      - name: Upload SARIF artifact
        if: always() && hashFiles('gitleaks-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: gitleaks-results.sarif
          if-no-files-found: ignore

      - name: Fail if leaks were found
        if: always()
        run: |
          if [[ "${{ steps.scan.outputs.exit_code }}" == "2" ]]; then
            echo "Leaks detected by gitleaks."
            exit 1
          fi
