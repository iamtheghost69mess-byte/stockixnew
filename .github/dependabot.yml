version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      runtime-minor:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "nestjs"
          - "@nestjs/*"
      types-minor:
        applies-to: version-updates
        patterns:
          - "@types/*"
        update-types:
          - minor
          - patch
      dev-tooling-minor:
        applies-to: version-updates
        patterns:
          - "eslint*"
          - "prettier"
          - "vitest"
          - "@vitest/*"
          - "typescript"
          - "turbo"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "next"
        update-types:
          - version-update:semver-major
      - dependency-name: "react"
        update-types:
          - version-update:semver-major
      - dependency-name: "react-dom"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor:
        applies-to: version-updates
        update-types:
          - minor
          - patch
